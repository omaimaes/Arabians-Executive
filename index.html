  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

4m .pl-row .pl-name[contenteditable=\"true\"], .s4m .pl-row .pl-meta[contenteditable=\"true\"]{cursor:text;outline:none;border-radius:1px;padding:1px 4px;margin:-1px -4px;transition:background 160ms ease, box-shadow 160ms ease;white-space:normal;overflow:visible;text-overflow:clip}\n.s4m .pl-row .pl-name[contenteditable=\"true\"]:hover, .s4m .pl-row .pl-meta[contenteditable=\"true\"]:hover{background:rgba(201,168,76,0.06)}\n.s4m .pl-row .pl-name[contenteditable=\"true\"]:focus, .s4m .pl-row .pl-meta[contenteditable=\"true\"]:focus{background:rgba(201,168,76,0.10);box-shadow:inset 0 -1px 0 var(--gold)}\n\n/* === PIN LABEL LEGIBILITY (stronger shadow, slight stroke) === */\n.s4m .pin .lbl-name, .s4m .pin .lbl-country, .s4m .pin .lbl-date{paint-order:stroke fill;stroke:rgba(10,13,20,0.95);stroke-width:3px;stroke-linejoin:round}\n.s4m .pin .lbl-leader{stroke:currentColor;stroke-width:1;opacity:0.55;vector-effect:non-scaling-stroke;pointer-events:none}\n.s4m .pin:hover .lbl-leader, .s4m .pin.active .lbl-leader{opacity:1}\n\n/* === DATE LABEL ON PINS === */\n.s4m .pin .lbl-date{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:9px;letter-spacing:0.18em;fill:#C9A84C;text-shadow:0 1px 3px rgba(0,0,0,0.95),0 0 2px rgba(0,0,0,0.9);pointer-events:none;text-transform:uppercase}\n/* === DATE INPUT IN PANEL === */\n.s4m .pl-row{grid-template-columns:14px 1fr auto !important;align-items:start !important;padding:14px 12px !important}\n.s4m .pl-info{min-width:0}\n.s4m .pl-date-wrap{display:flex;align-items:center;gap:8px;margin-top:8px}\n.s4m .pl-date-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.22em;color:var(--mute-2);text-transform:uppercase}\n.s4m input.pl-date{flex:1;background:rgba(0,0,0,0.45);border:1px solid var(--line);color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;padding:5px 8px;outline:none;text-transform:uppercase;cursor:pointer;color-scheme:dark}\n.s4m input.pl-date:hover{border- }\n\n  .s5m .evt.shoot:hover .evt-pin, .s5m .evt.shoot:focus-visible .evt-pin, .s5m .evt.shoot.active .evt-pin{transform:scale(1.18)}\n  .s5m .evt.shoot:hover .evt-loc, .s5m .evt.shoot.active .evt-loc{color:#E0BC58}\n\n  /* ========= SLIDE 5 ========= */\n  .s5{\n    background:\n      radial-gradient(ellipse at 50% 28%, rgba(201,168,76,0.12), transparent 55%),\n      radial-gradient(ellipse at 50% 92%, rgba(0,0,0,0.6), transparent 50%),\n      var(--ink);\n    align-items:center;justify-content:center;padding:100px;\n  }\n  .s5 .inner{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:1200px;margin:auto}\n  .s5 .horse-mini{width:200px;height:200px;margin-bottom:48px;opacity:0.92}\n  .s5 .lead{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:76px;line-height:1.1;letter-spacing:-0.01em}\n  .s5 .lead .line2{color:var(--gold);font-style:italic}\n  .s5 .mid-rule{margin:48px 0;width:1px;height:54px;background:linear-gradient(180deg, var(--gold), transparent)}\n  .s5 .body-text{font-size:20px;line-height:1.8;color:var(--mute);max-width:900px;font-weight:300}\n  .s5 .closing{margin-top:48px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:34px;color:var(--gold);font-weight:500}\n  .s5 .sig{margin-top:60px;display:flex;gap:52px;align-items:center;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold-soft);letter-spacing:0.22em;font-size:16px;text-transform:uppercase}\n  .s5 .sig .bullet{width:5px;height:5px;background:var(--gold);border-radius:50%}\n\n  /* Reveal: slides mount with fade-in of children */\n  .reveal > *{opacity:0;transform:translateY(14px);transition:opacity 700ms ease, transform 700ms cubic-bezier(.22,.61,.36,1)}\n  [data-deck-active] .reveal > *{opacity:1;transform:translateY(0)}\n  [data-deck-active] .reveal > *:nth-child(1){transition-delay:120ms}\n  [data-deck-active] .reveal > *:nth-child(2){transition-delay:220ms}\n  [data-deck-active] .reveal > *:nth-child(3){transition-delay:320ms}\n  [data-deck-active] .reveal > *:nth-child(4){transition-delay:420ms}\n  [data-deck-active] .reveal > *:nth-child(5){transition-delay:520ms}\n  [data-deck-active] .reveal > *:nth-child(6){transition-delay:620ms}\n  [data-deck-active] .reveal > *:nth-child(7){transition-delay:720ms}\n  [data-deck-active] .reveal > *:nth-child(8){transition-delay:820ms}\n\n  /* Toast */\n  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);padding:14px 24px;background:rgba(13,17,23,0.95);border:1px solid var(--gold);color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.3em;text-transform:uppercase;opacity:0;pointer-events:none;transition:all 300ms ease;z-index:3000}\n  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}\n<\u002Fstyle>\n<style>/* =====================================================================\n   THE ARABIANS — BUSINESS SECTIONS (slides 06–17)\n   Extends the Series Treatment design system. All tokens (--gold, --navy,\n   --white, --mute, --line, Cormorant / JetBrains Mono / Jost) are inherited\n   from the host document.\n   ===================================================================== */\n\n/* ---------- shared scaffolding for the new content slides ---------- */\n.b-slide{padding:72px 100px 88px}\n.b-head{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;margin-bottom:30px;gap:60px}\n.b-head .b-kicker{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.34em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}\n.b-head h2{font-family:'Cormorant Garamond',serif;font-size:62px;font-weight:400;line-height:1;letter-spacing:0.01em;text-transform:uppercase}\n.b-head h2 em{font-style:italic;color:var(--gold);text-transform:none;font-weight:500}\n.b-head .b-lede{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--mute);font-size:23px;line-height:1.5;max-width:620px;text-align:right;text-wrap:pretty}\n.b-head .b-lede .hl{color:var(--gold);font-style:italic}\n\n/* ===================================================================\n   SECTION DIVIDERS  (slides 06, 11, 14)  — class .bsec\n   =================================================================== */\n.bsec{background:\n  radial-gradient(ellipse at 26% 32%, rgba(201,168,76,0.08), transparent 55%),\n  radial-gradient(ellipse at 82% 84%, rgba(30,25,15,0.5), transparent 52%),\n  var(--navy);\n  align-items:flex-start;justify-content:center;overflow:hidden;}\n.bsec .bsec-ghost{position:absolute !important;right:90px;top:50%;transform:translateY(-50%);z-index:1 !important;\n  font-family:'Cormorant Garamond',serif;font-weight:300;font-size:560px;line-height:0.7;\n  color:rgba(201,168,76,0.07);letter-spacing:-0.04em;pointer-events:none;user-select:none}\n.bsec .bsec-inner{position:relative;z-index:3 !important;max-width:980px}\n.bsec .bsec-index{display:flex;align-items:center;gap:24px;margin-bottom:40px}\n.bsec .bsec-index .num{font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:0.4em;color:var(--gold)}\n.bsec .bsec-index .ln{width:120px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}\n.bsec .bsec-index .of{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.34em;color:var(--mute-2);text-transform:uppercase}\n.bsec h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:148px;line-height:0.94;\n  letter-spacing:-0.01em;text-transform:uppercase;color:var(--white)}\n.bsec h1 .thin{display:block;font-size:0.46em;letter-spacing:0.02em}\n.bsec .bsec-rule{width:140px;height:1px;background:linear-gradient(90deg,var(--gold),rgba(201,168,76,0.2),transparent);margin:46px 0 38px}\n.bsec .bsec-tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:38px;color:var(--gold);letter-spacing:0.01em;line-height:1.25;max-width:980px;text-wrap:pretty}\n.bsec .bsec-foot{position:absolute !important;bottom:40px;left:100px;z-index:3 !important;display:flex;gap:14px;align-items:center;\n  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.34em;color:var(--mute-2);text-transform:uppercase}\n.bsec .bsec-foot .gd{color:var(--gold)}\n\n/* ===================================================================\n   STRATEGY SLIDES  (07, 09)  — class .bstrat\n   Two-column: left = positioning + target + split ; right = stats + arcs\n   =================================================================== */\n.bstrat .b-body{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;\n  border-top:1px solid var(--line-strong);min-height:0}\n.bstrat .col{padding:34px 0 0;display:flex;flex-direction:column;min-height:0}\n.bstrat .col.left{padding-right:56px;border-right:1px solid var(--line-strong)}\n.bstrat .col.right{padding-left:56px}\n\n.bstrat .position{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:27px;line-height:1.42;\n  color:var(--white);letter-spacing:0.003em;text-wrap:pretty}\n.bstrat .position em{color:var(--gold);font-style:italic}\n\n.bstrat .target{margin-top:30px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(26,31,44,0.5),rgba(13,17,23,0.25));\n  padding:22px 26px;position:relative}\n.bstrat .target::before{content:\"\";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold)}\n.bstrat .target .tlabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}\n.bstrat .target .tname{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:400;line-height:1;color:var(--white)}\n.bstrat .target .tdesc{margin-top:9px;font-size:14.5px;line-height:1.55;color:var(--mute);font-weight:300;max-width:560px}\n\n/* secondary targets — same vocabulary as Primary Target, paired + lighter */\n.bstrat .sec-targets{margin-top:22px}\n.bstrat .sec-targets .sec-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:12px}\n.bstrat .sec-targets .sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.bstrat .target.sec{margin-top:0;padding:16px 20px;background:linear-gradient(180deg,rgba(26,31,44,0.34),rgba(13,17,23,0.18))}\n.bstrat .target.sec::before{background:rgba(201,168,76,0.55)}\n.bstrat .target.sec .tname{font-size:23px}\n.bstrat .target.sec .tdesc{margin-top:7px;font-size:12.5px;line-height:1.5}\n\n.bstrat .split{margin-top:auto;padding-top:26px}\n.bstrat .split .slabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.3em;color:var(--mute);text-transform:uppercase;margin-bottom:12px}\n.bstrat .split .bar{height:46px;display:flex;border:1px solid var(--line-strong);overflow:hidden}\n.bstrat .split .seg{display:flex;align-items:center;padding:0 18px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.16em;text-transform:uppercase}\n.bstrat .split .seg.major{background:linear-gradient(135deg,var(--gold-deep),var(--gold-soft));color:var(--ink);font-weight:500}\n.bstrat .split .seg.minor{background:rgba(13,17,23,0.6);color:var(--mute);border-left:1px solid var(--line-strong)}\n\n/* right column */\n.bstrat .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px}\n.bstrat .stat{padding:0 22px;border-right:1px solid var(--line)}\n.bstrat .stat:first-child{padding-left:0}\n.bstrat .stat:last-child{border-right:0}\n.bstrat .stat .figure{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:64px;line-height:0.9;color:var(--gold);letter-spacing:-0.01em}\n.bstrat .stat .cap{margin-top:10px;font-size:13px;line-height:1.45;color:var(--mute);font-weight:300}\n.bstrat .stat .cap b{color:var(--white);font-weight:500}\n\n.bstrat .arcs-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.3em;color:var(--mute);text-transform:uppercase;margin-bottom:14px}\n.bstrat .arcs{display:flex;flex-direction:column;gap:0;flex:1;min-height:0}\n.bstrat .arc{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;\n  padding:13px 0;border-bottom:1px solid var(--line);transition:padding-left 240ms ease,background 240ms ease}\n.bstrat .arc:hover{padding-left:12px;background:linear-gradient(90deg,rgba(201,168,76,0.06),transparent)}\n.bstrat .arc .aname{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:400;color:var(--white);line-height:1.1}\n.bstrat .arc .adesc{font-size:12.5px;color:var(--mute);font-weight:300;line-height:1.4;margin-top:3px}\n.bstrat .arc .badge{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.22em;padding:4px 9px;text-transform:uppercase;white-space:nowrap}\n.bstrat .arc .badge.primary{color:var(--ink);background:var(--gold)}\n.bstrat .arc .badge.supporting{color:var(--gold);border:1px solid var(--line-strong)}\n\n/* \"why lower risk\" inset used on slide 09 in place of one stat block */\n.bstrat .risk{border:1px solid var(--line);background:linear-gradient(180deg,rgba(26,31,44,0.5),rgba(13,17,23,0.25));\n  padding:18px 22px;margin-bottom:22px}\n.bstrat .risk .rl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.28em;color:var(--gold);text-transform:uppercase;margin-bottom:9px}\n.bstrat .risk p{font-size:13.5px;line-height:1.55;color:var(--mute);font-weight:300}\n.bstrat .risk p + p{margin-top:9px}\n.bstrat .risk p .lead{color:var(--white);font-weight:500}\n\n/* ===================================================================\n   VALIDATION SLIDES  (08, 10)  — class .bval\n   case-study cards in a row\n   =================================================================== */\n.bval .b-body{flex:1;display:grid;gap:24px;min-height:0;align-content:stretch}\n.bval.three .b-body{grid-template-columns:repeat(3,1fr)}\n.bval.two .b-body{grid-template-columns:1fr 1fr}\n\n.bcase{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(26,31,44,0.4),rgba(13,17,23,0.2));\n  padding:30px 30px 28px;display:flex;flex-direction:column;overflow:hidden;\n  transition:border-color 320ms ease,background 320ms ease,transform 320ms ease}\n.bcase:hover{border-color:var(--line-strong);background:linear-gradient(180deg,rgba(30,36,52,0.6),rgba(22,27,39,0.3));transform:translateY(-4px)}\n.bcase::after{content:\"\";position:absolute;left:0;top:0;width:0;height:2px;background:var(--gold);transition:width 420ms cubic-bezier(.22,.61,.36,1)}\n.bcase:hover::after{width:100%}\n.bcase .ctitle{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:400;line-height:0.98;text-transform:uppercase;letter-spacing:0.01em;color:var(--white)}\n.bcase .corigin{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase}\n.bcase .cstats{display:flex;gap:0;margin:26px 0 22px;border-top:1px solid var(--line)}\n.bcase .cstat{flex:1;padding:18px 16px 0 0}\n.bcase .cstat + .cstat{padding-left:18px;border-left:1px solid var(--line)}\n.bcase .cstat .figure{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:46px;line-height:0.88;color:var(--gold);letter-spacing:-0.01em}\n.bcase .cstat .cap{margin-top:8px;font-size:11.5px;line-height:1.4;color:var(--mute);font-weight:300}\n.bcase .cdesc{margin-top:auto;font-size:14px;line-height:1.6;color:var(--mute);font-weight:300;text-wrap:pretty}\n.bcase.feature{background:linear-gradient(180deg,rgba(201,168,76,0.1),rgba(13,17,23,0.3));border-color:var(--line-strong)}\n.bcase .ctag{position:absolute;top:0;right:0;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.2em;\n  color:var(--ink);background:var(--gold);padding:5px 12px;text-transform:uppercase}\n\n/* expansion / parallel note band used on slides 08 & 10 */\n.bval .b-note{margin-top:24px;border:1px solid var(--line);background:rgba(13,17,23,0.55);padding:20px 28px;\n  display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}\n.bval .b-note .nlabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.26em;color:var(--gold);text-transform:uppercase;line-height:1.5;max-width:230px}\n.bval .b-note p{font-size:14.5px;line-height:1.6;color:var(--mute);font-weight:300;text-wrap:pretty}\n.bval .b-note p b{color:var(--white);font-weight:500}\n.bval .b-note p em{color:var(--gold);font-style:italic}\n\n/* market-expansion mini stats (slide 10) inside the note */\n.bval .exp-stats{display:flex;gap:34px}\n.bval .exp-stats .es{text-align:left}\n.bval .exp-stats .es .f{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:40px;color:var(--gold);line-height:0.9}\n.bval .exp-stats .es .c{margin-top:6px;font-size:11px;line-height:1.4;color:var(--mute);font-weight:300}\n\n/* ===================================================================\n   DISTRIBUTION — THREE TRACKS  (slide 12)  — class .btrack\n   =================================================================== */\n.btrack .b-body{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;min-height:0}\n.bcard{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(26,31,44,0.42),rgba(13,17,23,0.2));\n  padding:34px 32px 30px;display:flex;flex-direction:column;overflow:hidden;transition:border-color 320ms ease,background 320ms ease}\n.bcard:hover{border-color:var(--line-strong);background:linear-gradient(180deg,rgba(30,36,52,0.6),rgba(22,27,39,0.3))}\n.bcard .tracknum{font-family:'Cormorant Garamond',serif;font-size:140px;font-weight:300;line-height:0.8;\n  color:rgba(201,168,76,0.13);letter-spacing:-0.03em;position:absolute;top:18px;right:26px;pointer-events:none}\n.bcard .tk-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;position:relative;z-index:1}\n.bcard .tk-badge{display:inline-block;margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.22em;\n  text-transf e-height:1.2}\n.btbl tbody tr:last-child td{border-bottom:0}\n.btbl .rate{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;display:flex;align-items:center;gap:9px}\n.btbl .rate::before{content:\"\";width:8px;height:8px;flex-shrink:0;border-radius:50%}\n.btbl .rate.high{color:var(--gold)}.btbl .rate.high::before{background:var(--gold);box-shadow:0 0 8px rgba(201,168,76,0.7)}\n.btbl .rate.mid{color:#C9A84C}.btbl .rate.mid::before{background:transparent;border:1px solid var(--gold)}\n.btbl .rate.low{color:var(--mute-2)}.btbl .rate.low::before{background:transparent;border:1px solid var(--mute-2)}\n.btbl .rate.yes{color:var(--gold)}.btbl .rate.yes::before{background:var(--gold);box-shadow:0 0 8px rgba(201,168,76,0.7)}\n.btbl .rate.partial{color:#C9A84C}.btbl .rate.partial::before{background:linear-gradient(90deg,var(--gold) 50%,transparent 50%);border:1px solid var(--gold)}\n.btbl .rate.no{color:var(--mute-2)}.btbl .rate.no::before{background:transparent;border:1px solid var(--mute-2)}\n.btbl .rdesc{margin-top:6px;font-size:12.5px;line-height:1.4;color:var(--mute);font-weight:300}\n/* column hover highlight — pure CSS via :has(), no JS */\n.btbl thead th.trk-h{cursor:default}\n.btbl table:has(.c1:hover) td.c1,.btbl table:has(.c1:hover) th.c1,\n.btbl table:has(.c2:hover) td.c2,.btbl table:has(.c2:hover) th.c2,\n.btbl table:has(.c3:hover) td.c3,.btbl table:has(.c3:hover) th.c3{background:rgba(201,168,76,0.07)}\n.btbl table:has(.c1:hover) th.c1 .th-name,\n.btbl table:has(.c2:hover) th.c2 .th-name,\n.btbl table:has(.c3:hover) th.c3 .th-name{color:var(--gold)}\n\n/* ===================================================================\n   COMMERCIAL CONSIDERATIONS  (slide 15)  — class .bcons\n   =================================================================== */\n.bcons .b-body{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line-strong);min-height:0}\n.bcons .consid{padding:44px 0 0;disp ition:none}\n}\n\n/* =====================================================================\n   MOTION LAYER — all gated on [data-deck-active] + reduced-motion,\n   all end states fully visible so nothing can render blank.\n   ===================================================================== */\n\n/* ---- chapter-divider gold light sweep on entrance ---- */\n.bsec::after{content:\"\";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;\n  background:linear-gradient(105deg,transparent 38%,rgba(201,168,76,0.10) 47%,rgba(255,242,206,0.20) 50%,rgba(201,168,76,0.10) 53%,transparent 62%);\n  transform:translateX(-55%)}\n@media (prefers-reduced-motion:no-preference){\n  [data-deck-active].bsec::after{animation:bmSheen 1900ms cubic-bezier(.4,0,.2,1) 250ms 1 forwards}\n}\n@keyframes bmSheen{0%{transform:translateX(-55%);opacity:0}28%{opacity:1}100%{transform:translateX(55%);opacity:0}}\n\n/* ---- slow parallax drift on the giant ghost numeral while the chapter is on ---- */\n@media (prefers-reduced-motion:no-preference){\n  [data-deck-active].bsec .bsec-ghost{animation:bmGhostDrift 9s ease-in-out infinite alternate}\n}\n@keyframes bmGhostDrift{\n  0%{transform:translateY(-50%) translateX(0) scale(1)}\n  100%{transform:translateY(-50%) translateX(-30px) scale(1.025)}\n}\n\n/* ---- content-split bar growth (slides 07/09) — JS sets flex-basis 0→target ---- */\n.bstrat .split .seg.major{transition:flex-basis 1150ms cubic-bezier(.22,.61,.36,1)}\n\n/* ---- count-up figures sit at their final value by default; JS only animates the digits ---- */\n\n/* ---- table / matrix row stagger ---- */\n.btbl tbody tr,.bmatrix tbody tr{opacity:0;transform:translateY(12px);\n  transition:opacity 620ms ease,transform 620ms cubic-bezier(.22,.61,.36,1)}\n.btbl[data-deck-active] tbody tr,.bmatrix[data-deck-active] tbody tr{opacity:1;transform:none}\n.btbl[data-deck-active] tbody tr:nth-child(1),.bmatrix[data-deck-active] tbody tr:nth-child(1){transition-delay:240ms}\n.btbl[data-deck-active] tbody tr:nth-child(2),.bmatrix[data-deck-active] tbody tr:nth-child(2){transition-delay:360ms}\n.btbl[data-deck-active] tbody tr:nth-child(3),.bmatrix[data-deck-active] tbody tr:nth-child(3){transition-delay:480ms}\n.btbl[data-deck-active] tbody tr:nth-child(4),.bmatrix[data-deck-active] tbody tr:nth-child(4){transition-delay:600ms}\n.btbl[data-deck-active] tbody tr:nth-child(5){transition-delay:720ms}\n@media (prefers-reduced-motion:reduce){\n  .btbl tbody tr,.bmatrix tbody tr{opacity:1;transform:none;transition:none}\n}\n\n/* ---- matrix check-marks pop in, Arabians column gets a soft settle glow ---- */\n.bmatrix .mk.yes{transition:transform 460ms cubic-bezier(.34,1.56,.64,1),text-shadow 600ms ease;transform:scale(0.4);opacity:0}\n.bmatrix[data-deck-active] .mk.yes{transform:scale(1);opacity:1}\n.bmatrix[data-deck-active] tbody tr:nth-child(1) .mk.yes{transition-delay:420ms}\n.bmatrix[data-deck-active] tbody tr:nth-child(2) .mk.yes{transition-delay:540ms}\n.bmatrix[data-deck-active] tbody tr:nth-child(3) .mk.yes{transition-delay:660ms}\n.bmatrix[data-deck-active] tbody tr:nth-child(4) .mk.yes{transition-delay:780ms}\n.bmatrix[data-deck-active] .arabians-c .mk.yes{text-shadow:0 0 16px rgba(201,168,76,0.55)}\n@media (prefers-reduced-motion:reduce){\n  .bmatrix .mk.yes{opacity:1;transform:none;transition:none}\n}\n\n/* ---- track cards: staggered rise + the primary track keeps a soft breathing glow ---- */\n.btrack .bcard{transition:border-color 320ms ease,background 320ms ease,box-shadow 1200ms ease,transform 700ms cubic-bezier(.22,.61,.36,1),opacity 700ms ease}\n.btrack[data-deck-active] .bcard:nth-child(1){transition-delay:0ms}\n@media (prefers-reduced-motion:no-preference){\n  .btrack[data-deck-active] .bcard.glow{animation:bmCardGlow 4.2s ease-in-out infinite}\n}\n@keyframes bmCardGlow{0%,100%{box-shadow:0 0 0 1px rgba(201,168,76,0.18),0 0 26px -6px rgba(201,168,76,0.18)}50%{box-shadow:0 0 0 1px rgba(201,168,76,0.42),0 0 40px -4px rgba(201,168,76,0.4)}}\n\n/* ---- stat figures: subtle gold under-glow as they count, fades after ---- */\n.bstrat .stat .figure,.bcase .cstat .figure,.bval .exp-stats .es .f{transition:text-shadow 800ms ease}\n.bm-counting{text-shadow:0 0 22px rgba(201,168,76,0.5)}\n\n/* ---- case cards: lift already; add staggered entrance hook for emphasis ---- */\n.bcase{transition:border-color 320ms ease,background 320ms ease,transform 320ms ease,box-shadow 320ms ease}\n.bcase:hover{box-shadow:0 22px 50px -24px rgba(0,0,0,0.7)}\n<\u002Fstyle>\n<style>/* =====================================================================\n   THE ARABIANS — DIRECTOR'S VISION  (cinematic treatment section)\n   Inherits all tokens + reuses .b-head / .b-kicker / .b-reveal from\n   business-slides.css. New classes are dv-prefixed. Decorative absolute\n   elements are always nested INSIDE a wrapper (never a direct .slide\n   child) to dodge the global position:relative override.\n   ===================================================================== */\n\n/* ---------- shared ---------- */\n.dv-slide{padding:72px 100px 84px}\n\n/* ===================================================================\n   SLIDE — DIRECTOR'S VISION OPENER  (.dvsec)\n   =================================================================== */\n.dvsec{padding:0;overflow:hidden;background:\n  radial-gradient(ellipse at 22% 26%, rgba(201,168,76,0.10), transparent 56%),\n  radial-gradient(ellipse at 86% 90%, rgba(30,25,15,0.55), transparent 50%),\n  var(--navy);}\n.dvsec .dv-wrap{flex:1;width:100%;min-height:0;display:grid;grid-template-columns:1.05fr 0.95fr;align-items:stretch}\n.dvsec .dv-left{padding:84px 64px 72px 100px;display:flex;flex-direction:column;justify-content:center;position:relative}\n.dvsec .dv-right{position:relative;border-left:1px solid var(--line);padding:84px 100px 72px 64px;display:flex;flex-direction:column;justify-content:center;\n  background:linear-gradient(180deg,rgba(13,17,23,0.2),rgba(6,8,12,0.4))}\n.dvsec .dv-kicker -gold)}\n.rtrack .rn{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:400;color:var(--white);line-height:1}\n.rtrack .rn em{font-style:italic;color:var(--gold)}\n.rstrip{position:relative;height:50px;display:flex;border:1px solid var(--line-strong);overflow:hidden;\n  background:linear-gradient(180deg,rgba(13,17,23,0.55),rgba(6,8,12,0.4))}\n.rstrip .cut{flex:1;border-right:1px solid rgba(201,168,76,0.20);position:relative}\n.rstrip .cut:last-child{border-right:0}\n.rstrip.fast .cut{background:linear-gradient(180deg,rgba(201,168,76,0.12),transparent 70%)}\n.rstrip.slow .cut{background:linear-gradient(180deg,rgba(201,168,76,0.05),transparent 70%)}\n/* sweeping playhead = the moving cut point; speed conveys tempo */\n.rstrip .playhead{position:absolute;top:-1px;bottom:-1px;left:0;width:2px;background:var(--gold);\n  box-shadow:0 0 16px 3px rgba(201,168,76,0.75)}\n.rstrip .playhead::before{content:\"\";position:absolute;top:0;bottom:0;right:0;width:46px;\n  background:linear-gradient(90deg,transparent,rgba(201,168,76,0.22));pointer-events:none}\n.rtrack .rfoot{display:flex;margin-top:13px}\n.rtrack .rdesc{font-size:14px;line-height:1.5;color:var(--mute);font-weight:300;text-align:left;max-width:none}\n@media (prefers-reduced-motion:no-preference){\n  .dvsec[data-deck-active] .rstrip.fast .playhead{animation:dvSweep 1.7s linear infinite}\n  .dvsec[data-deck-active] .rstrip.slow .playhead{animation:dvSweep 6.5s linear infinite}\n}\n@keyframes dvSweep{0%{left:-2px;opacity:0}6%{opacity:1}94%{opacity:1}100%{left:100%;opacity:0}}\n\n/* ===================================================================\n   SLIDE — FOUR WORLDS, FOUR MOODS  (.dvmood)  2×2 quadrant\n   =================================================================== */\n.dvmood .b-body{flex:1;margin-top:4px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0;\n  border-top:1px solid var(--line-strong);border-left:1px solid var(--line-strong);min-height:0}\n.dvworld{position:relative;padding:30px 44px 30px;border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);\n  background:linear-gradient(180deg,rgba(26,31,44,0.3),rgba(13,17,23,0.18));overflow:hidden;display:flex;flex-direction:column;\n  transition:background 380ms ease,box-shadow 380ms ease}\n.dvworld:hover{background:linear-gradient(180deg,rgba(30,36,52,0.58),rgba(22,27,39,0.3));box-shadow:inset 0 0 0 1px rgba(201,168,76,0.3)}\n.dvworld .w-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}\n.dvworld .w-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase}\n.dvworld .w-n{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--mute-2);font-weight:300}\n.dvworld h3{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:400;line-height:1;text-transform:uppercase;letter-spacing:0.01em;margin-bottom:14px;color:var(--white)}\n/* lighting swatch — expresses each world's mood */\n.dvworld .w-swatch{height:8px;width:100%;margin-bottom:18px;position:relative;overflow:hidden}\n.dvworld.arena   .w-swatch{background:linear-gradient(90deg,#1a1d26,#C9A84C 38%,#F3EEE2 52%,#C9A84C 66%,#1a1d26)}\n.dvworld.stable  .w-swatch{background:linear-gradient(90deg,#06080C 60%,#C9A84C 72%,#6E5A2B 78%,#06080C 86%)}\n.dvworld.farms   .w-swatch{background:linear-gradient(90deg,#2a2113,#6E5A2B,#C9A84C 60%,#E0BC58 80%,#9C8240)}\n.dvworld.homes   .w-swatch{background:linear-gradient(90deg,#11151E,#3a3f4d,#9C8240 70%,#6E5A2B)}\n.dvworld p{font-size:15px;line-height:1.6;color:var(--mute);font-weight:300;text-wrap:pretty;max-width:560px}\n.dvworld p em{color:var(--gold);font-style:italic}\n.dvworld .w-light{margin-top:auto;padding-top:16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.22em;color:var(--mute-2);text-transform:uppercase}\n.dvworld .w-ghost{position:absolute;bottom:-30px;right:30px;font-family:'Cormorant Garamond',serif;font-size:150px;font-weight:300;line-height:0.7;color:rgba(201,168,76,0.05);pointer-events:none}\n\n/* ===================================================================\n   SLIDE — THE CAMERA FOLLOWS EMOTION  (.dvcam)  4 editorial rows\n   =================================================================== */\n.dvcam .b-body{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line-strong);margin-top:6px}\n.dvrow{display:grid;grid-template-columns:64px 280px 1fr;align-items:center;gap:34px;padding:0 8px;flex:1;\n  border-bottom:1px solid var(--line);transition:padding-left 300ms ease,background 300ms ease}\n.dvrow:last-child{border-bottom:0}\n.dvrow:hover{padding-left:26px;background:linear-gradient(90deg,rgba(201,168,76,0.06),transparent 70%)}\n.dvrow .r-n{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;color:var(--gold);line-height:1;letter-spacing:-0.02em}\n.dvrow .r-name{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:400;text-transform:uppercase;letter-spacing:0.01em;color:var(--white);line-height:1.02}\n.dvrow .r-name .rs{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--gold-soft);text-transform:none;margin-top:4px;letter-spacing:0.01em}\n.dvrow .r-tech{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.dvrow .tech{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);padding:7px 13px;border:1px solid var(--line);background:rgba(13,17,23,0.5);\n  transition:border-color 260ms ease,color 260ms ease}\n.dvrow:hover .tech{border-color:var(--line-strong)}\n\n/* ===================================================================\n   SLIDE — RECURRING IMAGERY  (.dvmotif)  2×2 editorial text cards\n   =================================================================== */\n.dvmotif .b-body{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:22px;min-height:0}\n.dvcard{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(26,31,44,0.4),rgba(13,17,23,0.2));\n  padding:40px 56px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;\n  transition:border-color 340ms ease,background 340ms ease,padding-left 360ms ease}\n.dvcard:hover{border-color:var(--line-strong);background:linear-gradient(180deg,rgba(30,36,52,0.58),rgba(22,27,39,0.3));padding-left:64px}\n.dvcard::after{content:\"\";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gold);transition:width 460ms cubic-bezier(.22,.61,.36,1)}\n.dvcard:hover::after{width:100%}\n/* subtle corner numeral, consistent with the deck's other content slides */\n.dvcard::before{position:absolute;top:14px;right:40px;font-family:'Cormorant Garamond',serif;font-size:150px;font-weight:300;\n  line-height:1;color:rgba(201,168,76,0.07);letter-spacing:-0.03em;pointer-events:none}\n.dvcard:nth-child(1)::before{content:\"01\"}\n.dvcard:nth-child(2)::before{content:\"02\"}\n.dvcard:nth-child(3)::before{content:\"03\"}\n.dvcard:nth-child(4)::before{content:\"04\"}\n\n.dvcard .m-text{position:relative;z-index:1;max-width:680px}\n.dvcard .m-role{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}\n.dvcard h3{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:400;line-height:1;text-transform:uppercase;letter-spacing:0.01em;color:var(--white)}\n.dvcard .m-eq{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:var(--gold);margin:8px 0 22px;letter-spacing:0.01em}\n.dvcard p{font-size:19px;line-height:1.66;color:var(--white);opacity:0.82;font-weight:300;text-wrap:pretty;max-width:600px}\n.dvcard p em{color:var(--gold);font-style:italic;opacity:1}\n\n/* ===================================================================\n   SLIDE — SIGNATURE SCENES  (.dvscene)  4 numbered set-pieces\n   ================ stage.goTo (wired in toc-nav.js).\n   ===================================================================== */\n.toc{padding:74px 100px 80px;display:flex;flex-direction:column}\n\n.toc .toc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:60px;margin-top:14px}\n.toc .toc-kicker{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.36em;color:var(--gold);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:16px}\n.toc .toc-kicker .ln{width:54px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}\n.toc .toc-head h2{font-family:'Cormorant Garamond',serif;font-size:64px;font-weight:400;line-height:0.98;letter-spacing:0.01em;text-transform:uppercase}\n.toc .toc-head h2 em{font-style:italic;color:var(--gold);text-transform:none;font-weight:500}\n.toc .toc-lede{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--mute);font-size:22px;line-height:1.45;max-width:430px;text-align:right;text-wrap:pretty}\n\n.toc .toc-list{flex:1;display:flex;flex-direction:column;border-top:1px solid var(--line-strong);margin-top:30px;min-height:0}\n\n/* each chapter row — a real button so it's keyboard + click navigable */\n.toc .toc-row{position:relative;display:grid;grid-template-columns:118px 1fr auto 40px;align-items:center;gap:40px;\n  flex:1;min-height:0;padding:0 8px;text-align:left;cursor:pointer;color:inherit;\n  background:transparent;border:0;border-bottom:1px solid var(--line);font:inherit;\n  transition:padding-left 340ms cubic-bezier(.2,.7,.2,1),background 340ms ease}\n.toc .toc-row:last-child{border-bottom:0}\n.toc .toc-row:hover,.toc .toc-row:focus-visible{padding-left:30px;background:linear-gradient(90deg,rgba(201,168,76,0.08),transparent 72%);outline:none}\n/* gold edge that grows on hover/focus */\n.toc .toc-row::before{content:\"\";position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:0;background:var(--gold);transition:height 360ms cubic-bezier(.2,.7,.2,1)}\n.toc .toc-row:hover::before,.toc .toc-row:focus-visible::before{height:64%}\n\n.toc .t-num{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:58px;line-height:1;letter-spacing:-0.02em;color:var(--gold)}\n.toc .toc-row.intro .t-num{font-size:30px;color:var(--mute-2);font-style:italic}\n\n.toc .t-main{display:flex;flex-direction:column;gap:7px;min-width:0}\n.toc .t-title{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:400;line-height:1;text-transform:uppercase;letter-spacing:0.01em;color:var(--white)}\n.toc .toc-row:hover .t-title,.toc .toc-row:focus-visible .t-title{color:var(--gold)}\n.toc .t-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--mute);letter-spacing:0.01em}\n\n.toc .t-ref{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.26em;color:var(--mute-2);text-transform:uppercase;white-space:nowrap}\n.toc .toc-row:hover .t-ref,.toc .toc-row:focus-visible .t-ref{color:var(--gold-soft)}\n\n.toc .t-arrow{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--gold);justify-self:end;\n  opacity:0;transform:translateX(-10px);transition:opacity 300ms ease,transform 300ms ease}\n.toc .toc-row:hover .t-arrow,.toc .toc-row:focus-visible .t-arrow{opacity:1;transform:translateX(0)}\n\n.toc .toc-foot{margin-top:26px;display:flex;justify-content:space-between;align-items:center;\n  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.3em;color:var(--mute-2);text-transform:uppercase}\n.toc .toc-foot .gd{color:var(--gold)}\n.toc .toc-foot .hint{display:flex;align-items:center;gap:10px}\n.toc .toc-foot .hint kbd{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border:1px solid var(--line);color:var(--gold);letter-spacing:0.12em}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<deck-stage width=\"1920\" height=\"1080\">\n\n  <!-- ============ SLIDE 1 ============ -->\n  <section class=\"slide s1 grain\" data-label=\"Opening Statement\" =\"right-eb\">The Series, in Brief<\u002Fdiv>\n        <div class=\"pillars\">\n          <div class=\"pillar\" data-num=\"01\"><h3>First-of-its-kind production pairing<\u002Fh3><p>The Arab world’s #1 reality producer. The award-winning team behind Netflix’s <em>Drive to Survive<\u002Fem>. One exciting series.<\u002Fp><\u002Fdiv>\n          <div class=\"pillar\" data-num=\"02\"><h3>Soaring highs… crushing lows<\u002Fh3><p>Real rivalries, dynastic pride… character-driven drama which escalates every episode.<\u002Fp><\u002Fdiv>\n          <div class=\"pillar\" data-num=\"03\"><h3>The Global Champions Arabians Tour 2027<\u002Fh3><p>The F1 of Arabians competition. Every elite stud, every top handler sacrificing everything for the ultimate prize.<\u002Fp><\u002Fdiv>\n          <div class=\"pillar\" data-num=\"04\"><h3>Authentic Arab voices, universal perspectives<\u002Fh3><p>Arabic-first stories targeting a global audience — authenticity, emotion and competition.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"keywords\">\n          <div class=\"kw-label\">Themes ·<\u002Fdiv>\n          <button class=\"kw\" data-kw=\"rivalry\">Rivalry<\u002Fbutton>\n          <button class=\"kw\" data-kw=\"legacy\">Legacy<\u002Fbutton>\n          <button class=\"kw\" data-kw=\"prestige\">Prestige<\u002Fbutton>\n          <button class=\"kw\" data-kw=\"global\">Global Stage<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"kw-reveal\">\n          <div class=\"kw-hd\" data-s2x-hd=\"\">Themes<\u002Fdiv>\n          <div class=\"kw-body\" data-s2x-body=\"\">Four currents run through every episode — <em>rivalries<\u002Fem>, <em>legacy<\u002Fem>, the pursuit of championship, and the world watching.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"footer-2\">\n      <div class=\"lhs\">\n        <div class=\"from\">From <b>Givifii<\u002Fb> &amp; <b>Imagic<\u002Fb><\u002Fdiv>\n        <div>Executive Brief · Internal · Series Treatment<\u <\u002Fspan>Director's Vision<\u002Fdiv>\n        <h1>The Director's<br>Vision<em>A human drama, beautifully shot<\u002Fem><\u002Fh1>\n        <div class=\"dv-rule\"><\u002Fdiv>\n        <div class=\"dv-statement\">Behind the trophies and the shows, it's about <em>rivalries, ambition, and sacrifice<\u002Fem>. The horses are almost legendary — but the real story is the people: handlers fighting to prove themselves, owners trying to control the game, and families who live with the cost of chasing glory.<\u002Fdiv>\n        <div class=\"dv-foot\"><span class=\"gd\">A Note on Craft<\u002Fspan><span>·<\u002Fspan><span>Tone · Worlds · Camera · Imagery · Scenes<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dv-right\">\n        <div class=\"dv-rlabel\">The Editing Heartbeat<\u002Fdiv>\n        <div class=\"dv-rsub\">Fast, then slow — the audience stays inside the story<\u002Fdiv>\n        <div class=\"dvrhythm\">\n          <div class=\"rtrack rtrack--fast\">\n            <div class=\"rhead\">\n              <span class=\"rk\">Competition · In the arena<\u002Fspan>\n              <span class=\"rn\"><em>Fast<\u002Fem> cutting<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"rstrip fast\">\n              <span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan>\n              <span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan>\n              <span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan>\n              <span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan>\n              <span class=\"playhead\"><\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"rfoot\">\n              <span class=\"rdesc\">Quick edits and pounding hoofbeats raise the pulse.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"rtrack rtrack--slow\">\n            <div class=\"rhead\">\n              <span class=\"rk\">Behind the scenes · The wait<\u002Fspan>\n              <span class=\"rn\"><em>Slow<\u002Fem> takes<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"rstrip slow\">\n              <span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan><span class=\"cut\"><\u002Fspan>\n              <span class=\"playhead\"><\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"rfoot\">\n              <span class=\"rdesc\">Long takes hold the same nervous tension as the competitors.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FOUR WORLDS, FOUR MOODS ============ -->\n  <section class=\"slide dv-slide dvmood grain\" data-label=\"Four Worlds, Four Moods\" data-screen-label=\"09 Four Worlds\" data-om-validate=\"\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>09<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n\n    <div class=\"b-head reveal\">\n      <div>\n        <div class=\"b-kicker\">Director's Vision · The Visual System<\u002Fdiv>\n        <h2>Four Worlds, <em>Four Moods<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"b-lede\">Each place has its own light, <span class=\"hl\">and its own emotional register<\u002Fspan>.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"b-body\">\n      <div class=\"dvworld arena\">\n        <div class=\"w-top\"><span class=\"w-label\">World 01<\u002Fspan><span class=\"w-n\">01<\u002Fspan><\u002Fdiv>\n        <h3>The Arena<\u002Fh3>\n        <div class=\"w-swatch\"><\u002Fdiv>\n        <p>Bright, shiny and dramatic — almost like a gladiator fight. Lights reflect off the horses, and spotlights make the battles etflix<\u002Fdiv>\n        <div class=\"cstats\">\n          <div class=\"cstat\"><div class=\"figure\">1.65B<\u002Fdiv><div class=\"cap\">Viewing hours in first 28 days<\u002Fdiv><\u002Fdiv>\n          <div class=\"cstat\"><div class=\"figure\">#1<\u002Fdiv><div class=\"cap\">Most-watched Netflix series of all time<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"cdesc\">Korean-language, culturally specific, zero prior mainstream awareness. A world no one had seen became the phenomenon of the decade — through character and emotional stakes.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"bcase\">\n        <div class=\"ctitle\">Money Heist<\u002Fdiv>\n        <div class=\"corigin\">Spain · Netflix<\u002Fdiv>\n        <div class=\"cstats\">\n          <div class=\"cstat\"><div class=\"figure\">#1<\u002Fdiv><div class=\"cap\">Most-watched non-English series in Netflix history<\u002Fdiv><\u002Fdiv>\n          <div class=\"cstat\"><div class=\"figure\">190+<\u002Fdiv><div class=\"cap\">Countries reached post-acquisition<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"cdesc\">A modest Spanish broadcaster series acquired by Netflix. Cultural specificity became the draw, not the barrier — proving the local-to-global model at its most dramatic.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"bcase feature\">\n        <div class=\"ctag\">Closest comparable<\u002Fdiv>\n        <div class=\"ctitle\">Love Is Blind: Habibi<\u002Fdiv>\n        <div class=\"corigin\">Saudi Arabia · Netflix · Arabic-first<\u002Fdiv>\n        <div class=\"cstats\">\n          <div class=\"cstat\"><div class=\"figure\">Top 10<\u002Fdiv><div class=\"cap\">In 26 countries on release<\u002Fdiv><\u002Fdiv>\n          <div class=\"cstat\"><div class=\"figure\">#1<\u002Fdiv><div class=\"cap\">Non-English show in KSA, UAE &amp; Kuwait<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"cdesc\">An Arabic-language format, produced for a MENA-first audience, that travelled globally. The most direct comparable to the Breakout Strategy: local language, regional identity, international crossover.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SLIDE 09 — STRATEGY 2 ============ -->\n  <section class=\"slide b-slide bstrat grain\" data-label=\"The Global Strategy\" data-screen-label=\"16 Strategy 2 · International First\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>16<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n\n    <div class=\"b-head reveal\">\n      <div>\n        <div class=\"b-kicker\">Market Positioning · Strategy 2 of 2<\u002Fdiv>\n        <h2>The Global Strategy <em>— International First<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"b-lede\">A premium documentary series — <span class=\"hl\">a lower-risk path<\u002Fspan> to global reach.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"b-body b-reveal\">\n      <div class=\"col left\">\n        <p class=\"position\">A world global audiences have never seen. The Arabic cultural context — royalty, heritage, tradition — is the <em>texture<\u002Fem>. The human drama is <em>universal<\u002Fem>.<\u002Fp>\n        <div class=\"target\">\n          <div class=\"tlabel\">Primary Target<\u002Fdiv>\n          <div class=\"tname\">Netflix EMEA<\u002Fdiv>\n          <div class=\"tdesc\">Amsterdam HQ — the team that acquired <em style=\"color:var(--gold);font-style:italic\">Drive to Survive<\u002Fem> and <em style=\"color:var(--gold);font-style:italic\">Tour de France: Unchained<\u002Fem>. Not yet formally approached.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sec-targets\">\n          <div class=\"sec-label\">Secondary Targets<\u002Fdiv>\n          <div class=\"sec-grid\">\n            <div class=\"target sec\">\n              <div class=\"tname\">Amazon Prime<\u002Fdiv>\n              <div class=\"tdesc\">Introductory conversations underway but awaiting greenlight. Subject matter resonates with the Bezos family in light of their personal connection to the Arabian horse industry.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"target sec\">\n              <div class=\"tname\">Disney+<\u002Fdiv>\n              <div class=\"tdesc\">Fox Entertainment Global, which sells content to Disney+ and other platforms, has indicated potential acquisition interest following initial conversations.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"split\">\n          <div class=\"slabel\">Content Split · Internationally legible cast<\u002Fdiv>\n          <div class=\"bar\">\n            <div class=\"seg minor\" style=\"flex:0 0 50%;border-left:none\">50% Arabic<\u002Fdiv>\n            <div class=\"seg major\" style=\"flex:0 0 50%;border-left:1px solid var(--line-strong)\">50% International<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"col right\">\n        <div class=\"risk\">\n          <div class=\"rl\">Why this is lower risk<\u002Fdiv>\n          <p><span class=\"lead\">Not contingent on a single platform decision.<\u002Fspan> Netflix EMEA is the primary target — but it is not the only viable path to a global audience.<\u002Fp>\n          <p><b style=\"color:var(--white);font-weight:500\">If no global streamer:<\u002Fb> a global audience does not require a single global deal. Pursue an anchor sale in MENA and supplement with territory-by-territory distribution across Europe and North America.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"arcs-label\">Narrative Focus<\u002Fdiv>\n        <div class=\"arcs\">\n          <div class=\"arc\"><div><div class=\"aname\">The Philosophy War<\u002Fdiv><div class=\"adesc\">Precision vs. authenticity. Paolo vs Glenn — two philosophies, instantly accessible internationally.<\u002Fdiv><\u002Fdiv><span class=\"badge primary\">Primary<\u002Fspan><\u002Fdiv>\n          <div class=\"arc\"><div><div class=\"aname\">The Loyalty Crisis<\u002Fdiv><div class=\"adesc\">Trust, bias &amp; the cost of ambition. Glenn and Giulia's arc elevated — betrayal, redemption, universal emotional stakes.<\u002Fdiv><\u002Fdiv><span class=\"badge primary\">Primary<\u002Fspan><\u002Fdiv>\n          <div class=\"arc\"><div><div class=\"aname\">The Arab Rising Stars<\u002Fdiv><div class=\"adesc\">A new generation reclaims the ring. Cultural collision — both sides given equal weight.<\u002Fdiv><\u002Fdiv><span class=\"badge supporting\">Supporting<\u002Fspan><\u002Fdiv>\n          <div class=\"arc\"><div><div class=\"aname\">The Royal Rivalry<\u002Fdiv><div class=\"adesc\">Two Gulf powerhouses, one crown. The royal dimension as exotic world-building — backdrop, not primary driver.<\u002Fdiv><\u002Fdiv><span class=\"badge supporting\">Supporting<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SLIDE 10 — STRATEGY 2 VALIDATION ============ -->\n  <section class=\"slide b-slide bval two grain\" data-label=\"Global Strategy — Validation\" data-screen-label=\"17 Strategy 2 · Validation\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>17<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n\n    <div class=\"b-head reveal\">\n      <div>\n        <div class=\"b-kicker\">Strategy 2 · Validation<\u002Fdiv>\n        <h2>Globalizing the Niche. <em>New Markets.<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"b-lede\">New audiences, new markets — <span class=\"hl\">documented at scale<\u002Fspan>.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"b-body b-reveal\">\n      <div class=\"bcase feature\">\n        <div class=\"ctag\">EMEA precedent<\u002Fdiv>\n        <div class=\"ctitle\">Drive to Survive<\u002Fdiv>\n        <div class=\"corigin\">Formula 1 · Netflix EMEA · Box to Box Films<\u002Fdiv>\n        <div class=\"cstats\">\n          <div class=\"cstat\"><div class=\"figure\">44%<\u002Fdiv><div class=\"cap\">US viewership growth · 900K → 1.3M per race<\u002Fdiv><\u002Fdiv>\n          <div class=\"cstat\"><div class=\"figure\">360K+<\u002Fdiv><div class=\"cap\">New US fans generated by the series<\u002Fdiv><\u002Fdiv>\n          <div class=\"cstat\"><div class=\"figure\">18×<\u002Fdiv><div class=\"cap\">ESPN rights multiplied · $5M → $90M / season<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"cdesc\"><em>53% of US F1 fans<\u002Fem> cited the series as the reason they started watching. Acquired by the exact EMEA team we are targeting.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"bcase\">\n        <div class=\"ctitle\">Tour de France: Unchained<\u002Fdiv>\n        <div class=\"corigin\">Cycling · Netflix EMEA · Quad Films*<\u002Fdiv>\n        <div class=\"cstats\">\n          <div class=\"cstat\"><div class=\"figure\">36.1M<\u002Fdiv><div class=\"cap\">Viewing hours in 2023<\u002Fdiv><\u002Fdiv>\n          <div class=\"cstat\"><div class=\"figure\">Top 10<\u002Fdiv><div class=\"cap\">In 15 countries on release<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"cdesc\">A niche endurance sport, rendered universal. <em>*Quad Films is The Arabians' documentary production partner<\u002Fem> — the same craft team, the same EMEA route to market.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"b-note\">\n      <div class=\"exp-stats\">\n        <div class=\"es\"><div class=\"f\">1 race<\u002Fdiv><div class=\"c\">US had before DTS<br>(Austin only, since 2012)<\u002Fdiv><\u002Fdiv>\n        <div class=\"es\"><div class=\"f\">3 races<\u002Fdiv><div class=\"c\">US now hosts: Austin, Miami,<br>Las Vegas — unique globally<\u002Fdiv><\u002Fdiv>\n        <div class=\"es\"><div class=\"f\">$3B+<\u002Fdiv><div class=\"c\">Economic impact in 2023<br>from US races alone<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p><b>The GCAT parallel:<\u002Fb> GCAT already has Miami and Las Vegas on its 2026 calendar. <em>The Arabians<\u002Fem> can do for GCAT what Drive to Survive did for F1 — opening markets that did not exist and turning a regional competition into a global circuit.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SLIDE 11 — SECTION 02 DIVIDER ============ -->\n  <section class=\"slide bsec grain\" data-label=\"Distribution Strategy\" data-screen-label=\"18 Section · Distribution\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"vignette\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>18<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n    <div class=\"bsec-ghost\">03<\u002Fdiv>\n    <div class=\"bsec-inner reveal\">\n      <div class=\"bsec-index\"><span class=\"num\">03<\u002Fspan><span class=\"ln\"><\u002Fspan><span class=\"of\">Section Three of Four<\u002Fspan><\u002Fdiv>\n      <h1>Distribution<br>Strategy<\u002Fh1>\n      <div class=\"bsec-rule\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"bsec-foot\"><span class=\"gd\">The Route to Market<\u002Fspan><span>·<\u002Fspan><span>Tracks · Trade-offs<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SLIDE 12 — THREE TRACKS ============ -->\n  <section class=\"slide b-slide btrack grain\" data-label=\"How The Arabians Goes to Market\" data-screen-label=\"19 Three Tracks to Market\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>19<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n\n    <div class=\"b-head reveal\">\n      <div>\n        <div class=\"b-kicker\">Distribution · How The Arabians Goes to Market<\u002Fdiv>\n        <h2>Three Channels to Market<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"b-lede\">Different risk profiles. <span class=\"hl\">Not mutually exclusive.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"b-body b-reveal\">\n      <div class=\"bcard glow\">\n        <div class=\"tracknum\">1<\u002Fdiv>\n        <div class=\"tk-label\">Track One<\u002Fdiv>\n        <div><span class=\"tk-badge primary\">Primary<\u002Fspan><\u002Fdiv>\n        <h3>Global Platform Acquisition<\u002Fh3>\n        <div class=\"tk-rule\"><\u002Fdiv>\n        <p>A single global streaming platform acquires worldwide rights. One deal, full global reach, platform-backed marketing from day one.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"bcard\">\n        <div class=\"tracknum\">2<\u002Fdiv>\n        <div class=\"tk-label\">Track Two<\u002Fdiv>\n        <div><span class=\"tk-badge parallel\">Parallel<\u002Fspan><\u002Fdiv>\n        <h3>Arabic-Anchored Multi-Territory<\u002Fh3>\n        <div class=\"tk-rule\"><\u002Fdiv>\n        <p>A strong MENA anchor sale first. International sales agents then drive territory-by-territory deals across Europe, North America and Asia-Pacific.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"bcard\">\n        <div class=\"tracknum\">3<\u002Fdiv>\n        <div class=\"tk-label\">Track Three<\u002Fdiv>\n        <div><span class=\"tk-badge soft\">Works with Track 2<\u002Fspan><\u002Fdiv>\n        <h3>Revenue Share Model<\u002Fh3>\n        <div class=\"tk-rule\"><\u002Fdiv>\n        <p><b style=\"color:var(--white);font-weight:500\">No upfront acquisition fee.<\u002Fb> The platform makes the title available and shares advertising or subscription revenue with the rights holder across international territories.<\u002Fp>\n        <p style=\"margin-top:0.55em\"><em style=\"color:var(--gold);font-style:italic\">Amazon Prime Video Direct<\u002Fem> offers the clearest model for this approach — a proven distribution framework providing global reach across 240+ countries. Revenue share is calculated on streaming performance metrics.<\u002Fp>\n        <p style=\"margin-top:0.55em\">The key consideration is that marketing and audience acquisition costs are typically borne by the rights holder rather than the platform. Budget planning should account for this requirement.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  \n\n  <!-- ============ SLIDE 14 — SECTION 03 DIVIDER ============ -->\n  <section class=\"slide bsec grain\" data-label=\"Social Media Strategy\" data-screen-label=\"20 Section · Social Media\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"vignette\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>20<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n    <div class=\"bsec-ghost\">04<\u002Fdiv>\n    <div class=\"bsec-inner reveal\">\n      <div class=\"bsec-index\"><span class=\"num\">04<\u002Fspan><span class=\"ln\"><\u002Fspan><span class=\"of\">Section Four of Four<\u002Fspan><\u002Fdiv>\n      <h1>Social Media<br>Strategy<\u002Fh1>\n      <div class=\"bsec-rule\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"bsec-foot\"><span class=\"gd\">The Living Circuit<\u002Fspan><span>·<\u002Fspan><span>Considerations · Content · Channels<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SLIDE 15 — COMMERCIAL CONSIDERATIONS ============ -->\n  <section class=\"slide b-slide bcons grain\" data-label=\"Key Commercial Considerations\" data-screen-label=\"21 Commercial Considerations\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>21<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n\n    <div class=\"b-head reveal\">\n      <div>\n        <div class=\"b-kicker\">Social Media · Before We Build<\u002Fdiv>\n        <h2>Key Commercial <em>Considerations<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"b-lede\">Two dependencies that <span class=\"hl\">shape the scope<\u002Fspan> of everything that follows.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"b-body b-reveal\">\n      <div class=\"consid first\">\n        <div class=\"c-index\"><span class=\"n\">01<\u002Fspan><span class=\"tk\">Dependency · Deal Terms<\u002Fspan><\u002Fdiv>\n        <h3>Scope is subject to <em>distribution deal terms<\u002Fem><\u002Fh3>\n        <p>Under Distribution Track 1 (Global Platform Acquisition), our ability to operate independent social channels will be restricted. Platforms typically retain control over content published alongside their acquisitions. Content scope, channel ownership, posting frequency and publishing rights must all be formally negotiated with the platform.<\u002Fp>\n        <div class=\"flag\">Negotiated per acquisition deal<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"consid second\">\n        <div class=\"c-index\"><span class=\"n\">02<\u002Fspan><span class=\"tk\">Dependency · Budget<\u002Fspan><\u002Fdiv>\n        <h3>Content &amp; account management is <em>not yet budgeted<\u002Fem><\u002Fh3>\n        <p>The production of social content — score-reveal graphics, leaderboard assets, character cards, short-form edits and gap-event coverage — and the ongoing management of accounts across YouTube, TikTok, Instagram and the hosted hub, has not been included in the current production budgets.<\u002Fp>\n        <div class=\"flag\">Requires an incremental line<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SLIDE 16 — FOUR CONTENT TYPES ============ -->\n  <section class=\"slide b-slide bctype grain\" data-label=\"Four Content Types\" data-screen-label=\"22 Four Content Types\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>22<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n\n    <div class=\"b-head reveal\">\n      <div>\n        <div class=\"b-kicker\">Social Media · The Content System<\u002Fdiv>\n        <h2>Four Content Types<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"b-lede\">Each with its own <span class=\"hl\">purpose and cadence<\u002Fspan>.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"b-body reveal\">\n      <div class=\"bquad\">\n        <div class=\"qn\">01<\u002Fdiv>\n        <div class=\"ql\">Reach<\u002Fdiv>\n        <h3>Promos &amp; Trailers<\u002Fh3>\n        <ul>\n          <li>Series, character and story highlights — with a strong CTA to the platform<\u002Fli>\n          <li>Short-form cuts optimised per platform: <b>Reels, TikTok, YouTube Shorts<\u002Fb><\u002Fli>\n          <li>Arabic and English versions produced per positioning strategy<\u002Fli>\n          <li><span class=\"em\">The only type published across all three account sets<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"bquad\">\n        <div class=\"qn\">02<\u002Fdiv>\n        <div class=\"ql\">World-building<\u002Fdiv>\n        <h3>The Ecosystem<\u002Fh3>\n        <ul>\n          <li>Farm profiles, handler bios, scoring explainer, circuit map<\u002Fli>\n          <li>Hosted on <b>The Arabians microsite<\u002Fb> — linked from social<\u002Fli>\n          <li>Introduced at launch and maintained throughout the run<\u002Fli>\n          <li><span class=\"em\">5 criteria · 16 judges · high &amp; low scores removed<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"bquad\">\n        <div class=\"qn\">03<\u002Fdiv>\n        <div class=\"ql\">Engagement<\u002Fdiv>\n        <h3>The Shadow Circuit<\u002Fh3>\n        <ul>\n          <li><b>Pre-drop:<\u002Fb> standings &amp; gap results before each episode airs<\u002Fli>\n          <li><b>Post-drop:<\u002Fb> score-reveal card 48–72h after — winner, top 3, movement<\u002Fli>\n          <li>Designed shareable graphic + 15-sec motion cut for Reels &amp; TikTok<\u002Fli>\n          <li><span class=\"em\">Living leaderboard on the hub, updated every episode<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"bquad\">\n        <div class=\"qn\">04<\u002Fdiv>\n        <div class=\"ql\">Retention<\u002Fdiv>\n        <h3>Gap Events<\u002Fh3>\n        <ul>\n          <li>Covers GCAT events not featured in any episode — exclusive content<\u002Fli>\n          <li>Character check-ins, results and leaderboard shifts between episodes<\u002Fli>\n          <li>Rewards the most engaged viewers with what the series doesn't show<\u002Fli>\n          <li><span class=\"em\">Makes the full 14-event GCAT circuit feel complete<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SLIDE 17 — PUBLISHING MATRIX ============ -->\n  <section class=\"slide b-slide bmatrix grain\" data-label=\"Where Each Type Is Published\" data-screen-label=\"23 Publishing Matrix\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>23<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n\n    <div class=\"b-head reveal\">\n      <div>\n        <div class=\"b-kicker\">Social Media · Where Each Type Is Published<\u002Fdiv>\n        <h2>The Publishing Map<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"b-lede\"><span class=\"hl\">The Arabians' standalone accounts<\u002Fspan> carry all four content types.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"b-body reveal\">\n      <table>\n        <colgroup><col class=\"type\"><col class=\"acct\"><col class=\"acct\"><col class=\"acct\"><\u002Fcolgroup>\n        <thead>\n          <tr>\n            <th class=\"type-h\"><div class=\"ah-name\" style=\"font-size:15px;font-family:'JetBrains Mono',monospace;letter-spacing:0.28em;color:var(--mute)\">CONTENT TYPE<\u002Fdiv><\u002Fth>\n            <th><div class=\"ah-name\">Streamer's<\u002Fdiv><div class=\"ah-sub\">Platform channels<\u002Fdiv><\u002Fth>\n            <th><div class=\"ah-name\">GCAT's<\u002Fdiv><div class=\"ah-sub\">Official tour channels<\u002Fdiv><\u002Fth>\n            <th class=\"arabians-h\"><div class=\"ah-name\">The Arabians<\u002Fdiv><div class=\"ah-sub\">YouTube · TikTok · IG · Hub<\u002Fdiv><\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr>\n            <td class=\"type-c\"><div class=\"tname\">Promos &amp; Trailers<\u002Fdiv><div class=\"tsub\">Series, character and story highlights with strong CTA<\u002Fdiv><\u002Ftd>\n            <td><div class=\"mk yes\">✓<\u002Fdiv><\u002Ftd>\n            <td><div class=\"mk yes\">✓<\u002Fdiv><\u002Ftd>\n            <td class=\"arabians-c\"><div class=\"mk yes\">✓<\u002Fdiv><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"type-c\"><div class=\"tname\">The Ecosystem<\u002Fdiv><div class=\"tsub\">Farms, handlers, scoring guide, circuit map, world-building<\u002Fdiv><\u002Ftd>\n            <td><div class=\"mk no\">—<\u002Fdiv><\u002Ftd>\n            <td><div class=\"mk no\">—<\u002Fdiv><\u002Ftd>\n            <td class=\"arabians-c\"><div class=\"mk yes\">✓<\u002Fdiv><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"type-c\"><div class=\"tname\">The Shadow Circuit<\u002Fdiv><div class=\"tsub\">Pre-drop standings and post-drop score-reveal cards<\u002Fdiv><\u002Ftd>\n            <td><div class=\"mk no\">—<\u002Fdiv><\u002Ftd>\n            <td><div class=\"mk no\">—<\u002Fdiv><\u002Ftd>\n            <td class=\"arabians-c\"><div class=\"mk yes\">✓<\u002Fdiv><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"type-c\"><div class=\"tname\">Gap Events<\u002Fdiv><div class=\"tsub\">Social-only coverage of events not in any episode<\u002Fdiv><\u002Ftd>\n            <td><div class=\"mk no\">—<\u002Fdiv><\u002Ftd>\n            <td><div class=\"mk no\">—<\u002Fdiv><\u002Ftd>\n            <td class=\"arabians-c\"><div class=\"mk yes\">✓<\u002Fdiv><\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <div class=\"b-note\">Only <b>Promos &amp; Trailers<\u002Fb> run across all three account sets. All other content types are exclusive to The Arabians' standalone accounts — subject to distribution deal terms.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SLIDE 18 ============ -->\n  <section class=\"slide s5 grain\" data-label=\"Thank You\" data-screen-label=\"24 Thank You\">\n    <div class=\"vignette\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>24<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n\n    <div class=\"ty-wrap reveal\">\n      <div class=\"ty-eyebrow\">End of Treatment<\u002Fdiv>\n      <h1 class=\"ty-title\">Thank You<\u002Fh1>\n      <div class=\"ty-rule\"><\u002Fdiv>\n      <div class=\"ty-sub\">The Arabians — Respecting Beauty With Unity<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"footer-mark\"><span class=\"mono\">Prod·<\u002Fspan>A Series by IMAGIQ &amp; Givifii<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ APPENDIX — SECTION DIVIDER ============ -->\n  <section class=\"slide bsec grain\" data-label=\"Appendix\" data-screen-label=\"25 Appendix\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"vignette\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>25<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n    <div class=\"bsec-ghost\">A<\u002Fdiv>\n    <div class=\"bsec-inner reveal\">\n      <div class=\"bsec-index\"><span class=\"num\">A<\u002Fspan><span class=\"ln\"><\u002Fspan><span class=\"of\">Supplementary Material<\u002Fspan><\u002Fdiv>\n      <h1>Appendix<\u002Fh1>\n      <div class=\"bsec-rule\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"bsec-foot\"><span class=\"gd\">For Reference<\u002Fspan><span>·<\u002Fspan><span>Distribution · Trade-offs<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n<!-- ============ APPENDIX A — TRADE-OFFS TABLE ============ -->\n  <section class=\"slide b-slide btbl grain\" data-label=\"Understanding the Trade-offs\" data-screen-label=\"26 Appendix · Trade-offs\">\n    <div class=\"arabesque\"><\u002Fdiv>\n    <div class=\"brand-mark\"><span>GCAT/<\u002Fspan>The Arabians · Series Treatment<\u002Fdiv>\n    <div class=\"slide-num\"><span>26<\u002Fspan><span class=\"bar\"><\u002Fspan><span class=\"total\">26<\u002Fspan><\u002Fdiv>\n\n    <div class=\"b-head reveal\">\n      <div>\n        <div class=\"b-kicker\">Appendix · Understanding the Trade-offs<\u002Fdiv>\n        <h2>Understanding the <em>Trade-offs<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"b-lede\">The right choice depends on <span class=\"hl\">who commits first<\u002Fspan>.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"b-body reveal\">\n      <table>\n        <colgroup><col class=\"crit\"><col class=\"trk\"><col class=\"trk\"><col class=\"trk\"><\u002Fcolgroup>\n        <thead>\n          <tr>\n            <th class=\"crit-h\">Criterion<\u002Fth>\n            <th class=\"trk-h c1\"><div class=\"th-num\">Track 1<\u002Fdiv><div class=\"th-name\">Global Acquisition<\u002Fdiv><\u002Fth>\n            <th class=\"trk-h c2\"><div class=\"th-num\">Track 2<\u002Fdiv><div class=\"th-name\">Multi-Territory<\u002Fdiv><\u002Fth>\n            <th class=\"trk-h c3\"><div class=\"th-num\">T

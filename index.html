rack 3<\u002Fdiv><div class=\"th-name\">Revenue Share<\u002Fdiv><\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr>\n            <td class=\"crit-c\">Upfront revenue<\u002Ftd>\n            <td class=\"c1\"><div class=\"rate high\">High<\u002Fdiv><div class=\"rdesc\">Guaranteed acquisition fee<\u002Fdiv><\u002Ftd>\n            <td class=\"c2\"><div class=\"rate mid\">Medium<\u002Fdiv><div class=\"rdesc\">Anchor sale + territory fees<\u002Fdiv><\u002Ftd>\n            <td class=\"c3\"><div class=\"rate low\">None<\u002Fdiv><div class=\"rdesc\">Revenue share only<\u002Fdiv><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"crit-c\">Global reach from day one<\u002Ftd>\n            <td class=\"c1\"><div class=\"rate yes\">Yes<\u002Fdiv><div class=\"rdesc\">All markets simultaneously<\u002Fdiv><\u002Ftd>\n            <td class=\"c2\"><div class=\"rate no\">No<\u002Fdiv><div class=\"rdesc\">Builds territory by territory<\u002Fdiv><\u002Ftd>\n            <td class=\"c3\"><div class=\"rate partial\">Partial<\u002Fdiv><div class=\"rdesc\">Dependent on platform reach<\u002Fdiv><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"crit-c\">Sales agency requirement<\u002Ftd>\n            <td class=\"c1\"><div class=\"rate yes\">None<\u002Fdiv><div class=\"rdesc\">Platform handles all sales<\u002Fdiv><\u002Ftd>\n            <td class=\"c2\"><div class=\"rate mid\">Required<\u002Fdiv><div class=\"rdesc\">International sales agents needed<\u002Fdiv><\u002Ftd>\n            <td class=\"c3\"><div class=\"rate partial\">Dependent<\u002Fdiv><div class=\"rdesc\">May require agent for anchor sale<\u002Fdiv><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"crit-c\">Social media control<\u002Ftd>\n            <td class=\"c1\"><div class=\"rate low\">Restricted<\u002Fdiv><div class=\"rdesc\">Must negotiate with platform<\u002Fdiv><\u002Ftd>\n            <td class=\"c2\"><div class=\"rate yes\">Flexible<\u002Fdiv><div class=\"rdesc\">Equity owners control<\u002Fdiv><\u002Ftd>\n            <td class=\"c3\"><div class=\"rate yes\">Flexible<\u002Fdiv><div class=\"rdesc\">Full editorial control<\u002Fdiv><\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"crit-c\">Release timing control<\u002Ftd>\n            <td class=\"c1\"><div class=\"rate low\">Platform decides<\u002Fdiv><div class=\"rdesc\">No control over windows<\u002Fdiv><\u002Ftd>\n            <td class=\"c2\"><div class=\"rate yes\">Owner-led<\u002Fdiv><div class=\"rdesc\">Sequence markets at will<\u002Fdiv><\u002Ftd>\n            <td class=\"c3\"><div class=\"rate yes\">Owner-led<\u002Fdiv><div class=\"rdesc\">No platform window restrictions<\u002Fdiv><\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<!-- Modal (outside deck-stage so it overlays everything) -->\n<div class=\"modal-backdrop\" id=\"modal\">\n  <div class=\"modal\">\n    <div class=\"eyebrow\">New Character<\u002Fdiv>\n    <h3>Cast a New Face<\u002Fh3>\n    <div class=\"sub\">Add to the board — drag later to re-arc.<\u002Fdiv>\n\n    <div class=\"field\"><label>Name<\u002Flabel>\n      <input id=\"fName\" type=\"text\" placeholder=\"e.g. Rashid Al Thani\" autocomplete=\"off\"><\u002Fdiv>\n    <div class=\"field\"><label>Role / Stud<\u002Flabel>\n      <input id=\"fRole\" type=\"text\" placeholder=\"e.g. Handler · Al Shaqab (Qatar)\" autocomplete=\"off\"><\u002Fdiv>\n    <div class=\"field\"><label>Assign to Quadrant<\u002Flabel>\n      <select id=\"fQuad\">\n        <option value=\"1\">The Arab Rising Stars<\u002Foption>\n        <option value=\"2\">The Royal Rivalry<\u002Foption>\n        <option value=\"3\">The Loyalty Crisis<\u002Foption>\n        <option value=\"4\">The Philosophy War<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n    <div class=\"field\"><label>Photo URL (optional)<\u002Flabel>\n      <input id=\"fPhoto\" type=\"url\" placeholder=\"https://…\"><\u002Fdiv>\n\n    <div class=\"actions\">\n      <button class=\"btn\" id=\"cancelBtn\">Cancel<\u002Fbutton>\n      <button class=\"btn primary\" id=\"addBtn\">Add to Board<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"toast\" id=\"toast\">Card re-cast<\u002Fdiv>\n\n<div class=\"dup-pop\" id=\"dupPop\" role=\"menu\" aria-hidden=\"true\">\n  <div class=\"dup-eb\">Duplicate to…<\u002Fdiv>\n  <div class=\"dup-list\" id=\"dupList\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Character detail drawer -->\n<div class=\"drawer-backdrop\" id=\"drawerBackdrop\"><\u002Fdiv>\n<aside class=\"drawer\" id=\"drawer\" aria-hidden=\"true\">\n  <button class=\"dr-close\" id=\"drClose\" aria-label=\"Close\">×<\u002Fbutton>\n  <div class=\"dr-portrait\">\n    <div class=\"dr-tag\" id=\"drTag\">CAST<\u002Fdiv>\n    <div class=\"dr-flag\" id=\"drFlag\">—<\u002Fdiv>\n    <div class=\"dr-monogram\" id=\"drMono\">—<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"dr-body\">\n    <h3 class=\"dr-name\" id=\"drName\">—<\u002Fh3>\n    <div class=\"dr-role\" id=\"drRole\">—<\u002Fdiv>\n    <div class=\"dr-rule\"><\u002Fdiv>\n    <div class=\"dr-hook\" id=\"drHook\">—<\u002Fdiv>\n    <div class=\"dr-bio\" id=\"drBio\">—<\u002Fdiv>\n    <dl class=\"dr-meta\">\n      <dt>Origin<\u002Fdt><dd id=\"drOrigin\">—<\u002Fdd>\n      <dt>Arc<\u002Fdt><dd id=\"drArc\">—<\u002Fdd>\n      <dt>Rivals<\u002Fdt><dd id=\"drRivals\">—<\u002Fdd>\n    <\u002Fdl>\n  <\u002Fdiv>\n<\u002Faside>\n\n<script src=\"ffb67e09-686a-491d-8e9d-7eb5668769aa\"><\u002Fscript>\n<script>\n/* ============ CHARACTER BOARD ============ */\nfunction uid(){ return 'c_' + Math.random().toString(36).slice(2,10); }\n\nconst seed = [\n  /* OWNERS */\n  { id:'c_turki',   name:'Turki Al Othman',       role:'Owner · Ajmal Stud (Saudi Arabia)',    tag:'OWNER',   country:'Saudi Arabia',\n    q:1, hook:'\"Founded a stud at 17. World Champion at 20.\"',\n    bio:'At 23, one of the youngest stud owners on the GCAT and a full-time architecture student. His homebred stallion Sari became the first Saudi-bred male horse to win the World Championship — three years after he founded the farm. Dubai Stud took eight. His stated weakness: he gets emotionally attached to his horses and struggles to part with any of them.',\n    rivals:'Al Shaqab · Al Shahania' },\n\n  /* MANAGERS */\n  { id:'c_khalidj', name:'Khalid Al Jehani',      role:'Manager · Al Shaqab (Qatar)',          tag:'MANAGER', country:'Qatar',\n    q:2, hook:'\"He says Arnauld is winning. Raphael says Arnauld replaced him.\"',\n    bio:'Manager of Al Shaqab Stud — the most decorated farm in Qatar. Took over before Raphael Curti\\'s exit; now defends Arnauld Mertens, the protégé who replaced him. Holds firm opinions: thinks Giulia is too inexperienced, accuses Abdelaziz Al Marzooqi of excessive gossip, and questions whether Al Shahania can sustain a model where the same person owns and manages.',\n    rivals:'Dubai Stud · Al Wajba · Al Shahania' },\n  { id:'c_giulia',  name:'Giulia Bontempi',       role:'Manager · Hleetan (Qatar)',            tag:'MANAGER', country:'Italy',\n    q:3, hook:'\"24 years old. Fourth generation. Only woman in the room.\"',\n    bio:'Italian, 24, manager of Hleetan Stud and one of the very few female managers on the GCAT. Comes from a four-generation Arabian breeding family. Her plan: a long-horizon program reviving forgotten bloodlines to deliver exceptional horses in 5–10 years. In a relationship with Constantin, an assistant trainer at Al Shahania — they keep work strictly siloed. Frustrated that Olivia Strauch keeps her at arm\\'s length: \"There are so few women in this field. We should support each other.\"',\n    rivals:'Al Shaqab (Khalid) · Al Wajba (Olivia)' },\n  { id:'c_abdelaziz', name:'Abdelaziz Al Marzooqi', role:'Manager · Dubai Stud (UAE)',         tag:'MANAGER', country:'UAE',\n    q:2, hook:'\"Six years at #1. \\'All eyes are on us.\\'\"',\n    bio:'30 years in the game. Dubai Stud has held the world\\'s #1 ranking for six straight years under his watch — 100 employees, 400 horses he checks every day. Makes unannounced visits to Paolo\\'s training center in Italy where Dubai Stud summers its horses. Walks the desert and dives the sea to decompress. His only goal: keep Dubai Stud at the top.',\n    rivals:'Al Shaqab · Ajman Stud' },\n  { id:'c_khalido', name:'Khalid Al Omari',       role:'Manager · Ajman Stud (UAE)',           tag:'MANAGER', country:'UAE',\n    q:3, hook:'\"Inside the Emirates we compete. Abroad, we are one.\"',\n    bio:'Manager of Ajman Stud, close confidant of Sheikh Ammar. Refuses to install cameras to monitor staff — believes presence on the ground every day is the only way. Argues that for groomers to do their work properly, their personal lives have to be in order, so he gets involved when needed. Maintains a famously cooperative relationship with Abdelaziz at Dubai Stud — they openly share competition plans to avoid clashes.',\n    rivals:'Inside UAE: friendly · Abroad: united' },\n\n  /* HANDLERS */\n  { id:'c_azzam',   name:'Azzam Alqasem',         role:'Handler · KSA Studs',                  tag:'HANDLER', country:'Saudi Arabia',\n    q:1, hook:'\"My father gave us money for cars. We bought horses instead.\"',\n    bio:'Saudi Arabian, one of the very few Arab handlers competing at GCAT — and considered the best of them. Non-exclusive handler for two Saudi studs while running his own training center with his brother Abdullah. Defines himself as the underdog in a world dominated by Western handlers. Doesn\\'t hold back: openly says Raphael has been declining since leaving Al Shaqab, and that he lacks the natural talent of Glenn or Paolo. A judge has called him \"the handler who treats his horses the harshest\" — controversial, debated, but undeniable in the ring.',\n    rivals:'Glenn Schoukens · Tom Oben' },\n  { id:'c_arnauld', name:'Arnauld Mertens',       role:'Handler · Al Shaqab (Qatar)',          tag:'HANDLER', country:'Belgium',\n    q:2, hook:'\"27 years old. Replaced his own mentor.\"',\n    bio:'Belgian, 27, the youngest handler on the GCAT circuit. Stepped into Al Shaqab the moment his mentor Raphael Curti was forced out. Wants the title of Handler of the Tour — wants to prove himself against older men who underestimate him because of his age. He underestimates them right back: openly criticises Gerald Kurtz\\'s old-school methods and lack of physical fitness. On Raphael: \"A different kind of boss than the one I would like to be.\"',\n    rivals:'Glenn Schoukens · Paolo Capecci · Gerald Kurtz' },\n  { id:'c_gerald',  name:'Gerald Kurtz',          role:'Handler · Royal Cavalry of Oman',      tag:'HANDLER', country:'Austria',\n    q:4, hook:'\"Last man standing for Oman. One client. Everything on the line.\"',\n    bio:'Austrian, 52. The only exclusive handler for the Royal Cavalry of Oman — has lived there with his family for two years, responsible single-handedly for breeding, training, and showing. While other handlers spread risk across multiple stud farms, Gerald has bet his career on restoring one client\\'s reputation after years of neglect. Arnauld calls him \"too old\"; Gerald fires back that Arnauld\\'s nerves are visible to everyone in the ring — but concedes Arnauld has more raw talent than Raphael.',\n    rivals:'Arnauld Mertens · the next generation' },\n  { id:'c_raphael', name:'Raphael Curti',         role:'Handler · Al Wajba (Qatar)',           tag:'HANDLER', country:'France',\n    q:4, hook:'\"\\'I never made Al Shaqab lose.\\' Now he competes against the horses he raised.\"',\n    bio:'French, non-exclusive handler at Al Wajba. The official story is that Al Shaqab let him go; Raphael says he chose to leave. Either way, he now stands across the ring from horses he personally bred and raised. His mission: prove Al Shaqab made a mistake. Calls Paolo Capecci a sore loser and dismisses him as overrated — \"very flat\" performances. Dismisses Hleetan as not a real farm. Recently became a father, which he admits could affect his form.',\n    rivals:'Al Shaqab · Paolo Capecci · Arnauld' },\n  { id:'c_glenn',   name:'Glenn Schoukens',       role:'Handler · Hleetan & Ajman & Ajmal',    tag:'HANDLER', country:'Belgium',\n    q:3, hook:'\"The next #1. His brother trains. He performs.\"',\n    bio:'Belgian, the most talked-about handler on the circuit right now. Non-exclusive for Hleetan, Ajman (UAE), and Ajmal (Saudi Arabia). Widely tipped to take the #1 title from Paolo Capecci. Runs a Belgian training center with his brother Tom — Glenn handles the ring, Tom shapes the horses behind the scenes. His stallion Berlin posted top GCAT 2025 scores.',\n    rivals:'Paolo Capecci · Azzam Alqasem' },\n  { id:'c_tom',     name:'Tom Oben',              role:'Handler · Mid-tier Studs',             tag:'HANDLER', country:'Belgium',\n    q:4, hook:'\"Lost Al Shahania to a hernia. Wants it back.\"',\n    bio:'Belgian, 55. A handler of the older generation. Lost his strongest client, Al Shahania, after a hernia injury — they handed his slot to Giacomo Capecci. Now works only with smaller studs but is openly hunting his way back: \"Loyalty in this industry is hard to find — winning comes first.\" Maintains a strong friendship with Gerald Kurtz; same generation, same wars.',\n    rivals:'Giacomo Capecci · Glenn Schoukens' },\n\n  /* ADDED ON THE BOARD */\n  { id:'c_fhiqooji', name:'Paolo Capecci',    role:'Handler - Dubai Stud (UAE)',          q:2, photo:null },\n  { id:'c_uhruoynn', name:'Philippe Hosay',   role:'Handler - Ajmal Stud (KSA)',          q:1, photo:null },\n  { id:'c_o0uz5ffe', name:'Glenn Schoukens',  role:'Handler · Hleetan & Ajman & Ajmal',   q:4 },\n  { id:'c_oevygtvk', name:'Paolo Capecci',    role:'Handler - Dubai Stud (UAE)',          q:4, photo:null },\n];\n\nlet cards = loadCards();\n\nfunction loadCards(){\n  try{\n    const raw = localStorage.getItem('arabians_cards_v4');\n    if (!raw) return seed.slice();\n    const parsed = JSON.parse(raw);\n    if (!Array.isArray(parsed) || !parsed.length) return seed.slice();\n    return parsed;\n  }catch(e){ return seed.slice(); }\n}\nfunction saveCards(){ try{ localStorage.setItem('arabians_cards_v4', JSON.stringify(cards)); }catch(e){} }\n\nfunction initials(name){\n  return name.trim().split(/\\s+/).slice(0,2).map(p => p[0]).join('').toUpperCase();\n}\n\nfunction render(){\n  document.querySelectorAll('.s3 .q').forEach(q => {\n    const qi = parseInt(q.dataset.q, 10);\n    const list = q.querySelector('[data-cards]');\n    const count = q.querySelector('[data-count]');\n    list.innerHTML = '';\n    const inThis = cards.filter(c => c.q === qi);\n    count.textContent = inThis.length + ' CAST';\n    inThis.forEach(c => list.appendChild(makeCard(c)));\n  });\n  saveCards();\n}\n\nfunction makeCard(c){\n  const el = document.createElement('div');\n  el.className = 'card';\n  el.draggable = true;\n  el.dataset.id = c.id;\n\n  const av = document.createElement('div');\n  av.className = 'avatar';\n  if (c.photo){\n    av.style.backgroundImage = `url(\"${c.photo.replace(/\"/g,'&quot;')}\")`;\n    av.textContent = '';\n  } else {\n    av.textContent = initials(c.name);\n  }\n\n  const info = document.createElement('div');\n  info.className = 'info';\n  const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = c.name;\n  const rl = document.createElement('div'); rl.className = 'role'; rl.textContent = c.role;\n  info.appendChild(nm); info.appendChild(rl);\n\n  const del = document.createElement('button');\n  del.className = 'del';\n  del.innerHTML = '×';\n  del.title = 'Remove from board';\n  del.addEventListener('click', (e) => {\n    e.stopPropagation();\n    cards = cards.filter(x => x.id !== c.id);\n    render();\n    showToast('Removed');\n  });\n\n  const dup = document.createElement('button');\n  dup.className = 'dup';\n  dup.title = 'Duplicate to another quadrant';\n  dup.innerHTML = '<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\"><rect x=\"4.5\" y=\"4.5\" width=\"8\" height=\"8\"><\u002Frect><rect x=\"2\" y=\"2\" width=\"8\" height=\"8\" fill=\"rgba(13,17,23,0.95)\"><\u002Frect><\u002Fsvg>';\n  dup.addEventListener('click', (e) => {\n    e.stopPropagation();\n    openDupPicker(c, dup);\n  });\n\n  el.appendChild(av); el.appendChild(info); el.appendChild(dup); el.appendChild(del);\n\n  el.addEventListener('click', e => {\n    if (e.target.closest('.del')) return;\n    openDrawer(c);\n  });\n\n  el.addEventListener('dragstart', e => {\n    el.classList.add('dragging');\n    e.dataTransfer.effectAllowed = 'move';\n    e.dataTransfer.setData('text/plain', c.id);\n  });\n  el.addEventListener('dragend', () => el.classList.remove('dragging'));\n  return el;\n}\n\ndocument.querySelectorAll('.s3 .q').forEach(q => {\n  q.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; q.classList.add('drag-over'); });\n  q.addEventListener('dragleave', e => { if (!q.contains(e.relatedTarget)) q.classList.remove('drag-over'); });\n  q.addEventListener('drop', e => {\n    e.preventDefault();\n    q.classList.remove('drag-over');\n    const id = e.dataTransfer.getData('text/plain');\n    const qi = parseInt(q.dataset.q, 10);\n    const card = cards.find(c => c.id === id);\n    if (!card || card.q === qi) return;\n    card.q = qi;\n    render();\n    showToast('Re-cast');\n  });\n});\n\n/* ============ MODAL ============ */\nconst modal = document.getElementById('modal');\nconst fName = document.getElementById('fName');\nconst fRole = document.getElementById('fRole');\nconst fQuad = document.getElementById('fQuad');\nconst fPhoto = document.getElementById('fPhoto');\nconst fab = document.getElementById('fab');\n\nfab.addEventListener('click', (e) => {\n  e.stopPropagation();\n  modal.classList.add('open');\n  setTimeout(() => fName.focus(), 80);\n});\ndocument.getElementById('cancelBtn').addEventListener('click', closeModal);\nmodal.addEventListener('click', e => { if (e.target === modal) closeModal(); });\nwindow.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });\n\nfunction closeModal(){\n  modal.classList.remove('open');\n  fName.value = ''; fRole.value = ''; fPhoto.value = ''; fQuad.value = '1';\n}\n\ndocument.getElementById('addBtn').addEventListener('click', () => {\n  const name = fName.value.trim();\n  const role = fRole.value.trim();\n  if (!name){ fName.focus(); flash(fName); return; }\n  if (!role){ fRole.focus(); flash(fRole); return; }\n  const q = parseInt(fQuad.value, 10);\n  const photo = fPhoto.value.trim();\n  cards.push({ id: uid(), name, role, q, photo: photo || null });\n  render();\n  closeModal();\n  showToast('Added');\n});\n\nfunction flash(el){\n  const o = el.style.borderBottomColor;\n  el.style.borderBottomColor = '#E5514A';\n  setTimeout(() => el.style.borderBottomColor = o || '', 600);\n}\n\nconst toast = document.getElementById('toast');\nlet toastT;\nfunction showToast(msg){\n  toast.textContent = msg;\n  toast.classList.add('show');\n  clearTimeout(toastT);\n  toastT = setTimeout(() => toast.classList.remove('show'), 1400);\n}\n\n/* ============ DUPLICATE PICKER ============ */\nconst dupPop = document.getElementById('dupPop');\nconst dupList = document.getElementById('dupList');\nconst QUAD_NAMES = {\n  1: 'The Arab Rising Stars',\n  2: 'The Royal Rivalry',\n  3: 'The Loyalty Crisis',\n  4: 'The Philosophy War'\n};\nlet dupOpenForId = null;\n\nfunction openDupPicker(card, anchorEl){\n  dupOpenForId = card.id;\n  dupList.innerHTML = '';\n  Object.keys(QUAD_NAMES).forEach(k => {\n    const qi = parseInt(k, 10);\n    const btn = document.createElement('button');\n    btn.className = 'dup-opt';\n    btn.type = 'button';\n    btn.innerHTML = `<span class=\"dup-num\">0${qi}<\u002Fspan><span>${QUAD_NAMES[qi]}<\u002Fspan>`;\n    if (qi === card.q){\n      btn.disabled = true;\n      btn.querySelector('span:last-child').textContent = QUAD_NAMES[qi] + ' · current';\n    }\n    btn.addEventListener('click', (e) => {\n      e.stopPropagation();\n      cards.push({ id: uid(), name: card.name, role: card.role, q: qi, photo: card.photo });\n      render();\n      closeDupPicker();\n      showToast('Duplicated to ' + QUAD_NAMES[qi]);\n    });\n    dupList.appendChild(btn);\n  });\n  // Position popover near the anchor button\n  const r = anchorEl.getBoundingClientRect();\n  const popW = 260;\n  let left = r.right + 8;\n  if (left + popW > window.innerWidth - 12) left = r.left - popW - 8;\n  if (left < 12) left = 12;\n  let top = r.top - 4;\n  if (top + 240 > window.innerHeight - 12) top = window.innerHeight - 252;\n  if (top < 12) top = 12;\n  dupPop.style.left = left + 'px';\n  dupPop.style.top = top + 'px';\n  dupPop.classList.add('open');\n  dupPop.setAttribute('aria-hidden', 'false');\n}\nfunction closeDupPicker(){\n  dupPop.classList.remove('open');\n  dupPop.setAttribute('aria-hidden', 'true');\n  dupOpenForId = null;\n}\ndocument.addEventListener('click', (e) => {\n  if (dupOpenForId && !dupPop.contains(e.target) && !e.target.closest('.card .dup')) closeDupPicker();\n});\nwindow.addEventListener('keydown', e => { if (e.key === 'Escape' && dupOpenForId) closeDupPicker(); });\nwindow.addEventListener('resize', closeDupPicker);\n\nrender();\n\n/* ============ DRAWER ============ */\nconst drawer = document.getElementById('drawer');\nconst drawerBackdrop = document.getElementById('drawerBackdrop');\nconst arcLabels = {\n  1: 'The Underdog',\n  2: 'The Loyalty Crisis',\n  3: 'Clash of the Titans',\n  4: 'Handler of the Year'\n};\n\nfunction openDrawer(c){\n  document.getElementById('drTag').textContent = c.tag || 'CAST';\n  document.getElementById('drFlag').textContent = c.country || '—';\n  document.getElementById('drMono').textContent = initials(c.name);\n  document.getElementById('drName').textContent = c.name;\n  document.getElementById('drRole').textContent = c.role;\n  document.getElementById('drHook').textContent = c.hook || '';\n  document.getElementById('drBio').textContent = c.bio || 'Bio in development.';\n  document.getElementById('drOrigin').textContent = c.country || '—';\n  document.getElementById('drArc').innerHTML = '<em>Arc 0' + c.q + '<\u002Fem> &middot; ' + (arcLabels[c.q] || '—');\n  document.getElementById('drRivals').textContent = c.rivals || '—';\n  drawer.classList.add('open');\n  drawer.setAttribute('aria-hidden', 'false');\n  drawerBackdrop.classList.add('open');\n}\nfunction closeDrawer(){\n  drawer.classList.remove('open');\n  drawer.setAttribute('aria-hidden', 'true');\n  drawerBackdrop.classList.remove('open');\n}\ndocument.getElementById('drClose').addEventListener('click', closeDrawer);\ndrawerBackdrop.addEventListener('click', closeDrawer);\nwindow.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer(); });\n\n/* ============ SLIDE 02 — EXECUTIVE OVERVIEW ============ */\n(function(){\n  var slide = document.querySelector('.s2x'); if(!slide) return;\n  var dust = slide.querySelector('[data-s2x-dust]');\n  if(dust && !dust.children.length){\n    for(var i=0;i<38;i++){\n      var s = document.createElement('span');\n      var size = 1 + Math.random()*2.4;\n      s.style.left = (Math.random()*100) + '%';\n      s.style.top  = (60 + Math.random()*40) + '%';\n      s.style.width = s.style.height = size+'px';\n      s.style.opacity = (0.25 + Math.random()*0.55);\n      s.style.animationDuration = (8 + Math.random()*14) + 's';\n      s.style.animationDelay = (-Math.random()*16) + 's';\n      dust.appendChild(s);\n    }\n  }\n  var COPY = {\n    rivalry:{hd:'Rivalry',body:'Decades of bloodline feuds, championship grudges, and barn-by-barn obsession \\u2014 staged on the world\\u2019s most polished show grounds.'},\n    legacy:{hd:'Legacy',body:'A horse is never just a horse. It is a name, a sire, a 200-year inheritance carried by the families who breed them.'},\n    prestige:{hd:'Prestige',body:'Private jets, royal owners, eight-figure mares. Beauty, in this world, is the most expensive currency on earth.'},\n    global:{hd:'Global Stage',body:'Doha to Paris, Aachen to Scottsdale \\u2014 GCAT is the circuit. Every season ends with one horse crowned, and the world watching.'}\n  };\n  var DEFAULT = {hd:'Themes',body:'Four currents run through every episode \\u2014 <em>rivalries<\u002Fem>, <em>legacy<\u002Fem>, the pursuit of championship, and the world watching.'};\n  var hd = slide.querySelector('[data-s2x-hd]');\n  var body = slide.querySelector('[data-s2x-body]');\n  var chips = slide.querySelectorAll('.kw');\n  var locked = null;\n  function set(c){\n    body.style.opacity=0; hd.style.opacity=0;\n    hd.style.transform='translateY(6px)'; body.style.transform='translateY(6px)';\n    setTimeout(function(){\n      hd.textContent=c.hd; body.innerHTML=c.body;\n      hd.style.opacity=1; body.style.opacity=1;\n      hd.style.transform='translateY(0)'; body.style.transform='translateY(0)';\n    },220);\n  }\n  /* Smooth crossfade transitions */\n  hd.style.transition='opacity 220ms ease, transform 380ms cubic-bezier(.2,.7,.2,1)';\n  body.style.transition='opacity 220ms ease, transform 380ms cubic-bezier(.2,.7,.2,1)';\n\n  chips.forEach(function(chip){\n    chip.addEventListener('mouseenter',function(){pauseCycle();if(locked)return;chips.forEach(function(c){c.classList.remove('active')});chip.classList.add('active');set(COPY[chip.dataset.kw]);});\n    chip.addEventListener('mouseleave',function(){if(locked)return;chip.classList.remove('active');set(DEFAULT);resumeCycle();});\n    chip.addEventListener('click',function(){pauseCycle();if(locked===chip){locked=null;chip.classList.remove('active');set(DEFAULT);resumeCycle();}else{locked=chip;chips.forEach(function(c){c.classList.remove('active')});chip.classList.add('active');set(COPY[chip.dataset.kw]);}});\n  });\n\n  /* ===== Auto-cycle loop — motion-graphic theme rotation =====\n     Steps through rivalry → legacy → prestige → global → repeat.\n     Pauses on hover/click; resumes when interaction clears. */\n  var ORDER = ['rivalry','legacy','prestige','global'];\n  var idx = 0;\n  var cycleTimer = null;\n  var paused = false;\n\n  function tick(){\n    if (paused || locked) return;\n    var key = ORDER[idx];\n    var chip = slide.querySelector('.kw[data-kw=\"'+key+'\"]');\n    chips.forEach(function(c){c.classList.remove('active')});\n    if (chip) chip.classList.add('active');\n    set(COPY[key]);\n    idx = (idx + 1) % ORDER.length;\n  }\n  function startCycle(){\n    if (cycleTimer) return;\n    tick(); /* show first immediately */\n    cycleTimer = setInterval(tick, 3200);\n  }\n  function pauseCycle(){\n    paused = true;\n    if (cycleTimer){ clearInterval(cycleTimer); cycleTimer = null; }\n  }\n  function resumeCycle(){\n    paused = false;\n    if (locked) return;\n    /* small delay so it doesn't jump immediately on mouseleave */\n    setTimeout(function(){ if (!paused && !locked) startCycle(); }, 600);\n  }\n\n  /* Auto-start the loop unconditionally — the slide is part of the deck and the cycle is cheap.\n     Listen for slide changes to reset, but don't gate the initial start on it. */\n  var deck = document.querySelector('deck-stage');\n  if (deck){\n    deck.addEventListener('slidechange', function(e){\n      var isThis = e.detail && e.detail.slide === slide;\n      if (isThis){ idx = 0; if(!cycleTimer && !locked) startCycle(); }\n    });\n  }\n  setTimeout(function(){ startCycle(); }, 400);\n})();\n\n/* ============ SLIDE 5 — 2026 MILESTONES ============ */\n(function(){\n  var slide = document.querySelector('.s5m'); if(!slide) return;\n  var bokeh = slide.querySelector('[data-s5m-bokeh]');\n  if(bokeh && !bokeh.children.length){\n    for(var i=0;i<14;i++){\n      var s = document.createElement('span');\n      var size = 60 + Math.random()*180;\n      s.style.width = s.style.height = size+'px';\n      s.style.left = (Math.random()*100) + '%';\n      s.style.top  = (Math.random()*100) + '%';\n      s.style.opacity = (0.18 + Math.random()*0.45);\n      s.style.animationDuration = (8 + Math.random()*10) + 's';\n      s.style.animationDelay = (-Math.random()*8) + 's';\n      bokeh.appendChild(s);\n    }\n  }\n\n  var stops = slide.querySelectorAll('.stop, .evt');\n  var detail = slide.querySelector('#s5mDetail');\n  var dMonth = slide.querySelector('[data-d-month]');\n  var dName = slide.querySelector('[data-d-name]');\n  var dDesc = slide.querySelector('[data-d-desc]');\n  var locked = null;\n  var defaultStop = slide.querySelector('.stop.active, .evt.active, .evt.key');\n\n  function show(stop){\n    detail.classList.add('show');\n    var month = stop.dataset.month || (stop.dataset.date ? stop.dataset.date.split(' ')[1] || stop.dataset.date.split('—')[0] : '');\n    if(stop.dataset.date){\n      // For .evt items: pull leading month token from \"7—10 Jan 2027\"\n      var m = stop.dataset.date.match(/[A-Za-z]{3}/);\n      if(m) month = m[0].toUpperCase();\n    }\n    dMonth.textContent = month || '';\n    dName.textContent = stop.dataset.name + (stop.dataset.loc ? ' — ' + stop.dataset.loc : '');\n    dDesc.textContent = stop.dataset.desc;\n  }\n  function reset(){\n    if(defaultStop){ show(defaultStop); }\n    else { detail.classList.remove('show'); }\n  }\n  if(defaultStop) show(defaultStop);\n\n  stops.forEach(function(stop){\n    stop.addEventListener('mouseenter', function(){\n      if(locked) return;\n      stops.forEach(function(s){ if(s!==defaultStop) s.classList.remove('active'); });\n      stop.classList.add('active');\n      show(stop);\n    });\n    stop.addEventListener('mouseleave', function(){\n      if(locked) return;\n      if(stop!==defaultStop) stop.classList.remove('active');\n      reset();\n    });\n    stop.addEventListener('click', function(){\n      if(locked === stop){\n        locked = null;\n        if(stop!==defaultStop) stop.classList.remove('active');\n        reset();\n      } else {\n        locked = stop;\n        stops.forEach(function(s){ if(s!==defaultStop) s.classList.remove('active'); });\n        stop.classList.add('active');\n        show(stop);\n      }\n    });\n    stop.addEventListener('focus', function(){ if(!locked){ stops.forEach(function(s){ if(s!==defaultStop) s.classList.remove('active'); }); stop.classList.add('active'); show(stop); }});\n  });\n})();\n\n/* ============ TERRITORY MAP ============ */\n(function(){\n  const SVG_NS = 'http://www.w3.org/2000/svg';\n  const svg = document.getElementById('mapSvg');\n  const pinsLayer = document.getElementById('pinsLayer');\n  const countriesLayer = document.getElementById('countries');\n  const regionLabelsLayer = document.getElementById('regionLabels');\n  const mapWrap = document.getElementById('mapWrap');\n  const pinList = document.getElementById('pinList');\n  const locCount = document.getElementById('locCount');\n  const legend = document.getElementById('legend');\n  const mapLoading = document.getElementById('mapLoading');\n\n  const CATS = {\n    tour: { label:'Tour Stop',   desc:'GCAT Show' },\n    farm: { label:'Stud · Farm', desc:'Breeding'  },\n    both: { label:'Both',        desc:'Stud + Tour' }\n  };\n  const CAT_ORDER = ['tour','farm','both'];\n\n  /* Seed locations carry [lng, lat] — projection turns them into pixels at render time. */\n  const SEED = [\n    /* Arabia — Tour stops + farms */\n    { id:'l_abudhabi',   name:'Abu Dhabi',     country:'UAE',           meta:'Tour stop + farm',  cat:'both', date:'2027-01-15', lng:54.37, lat:24.47, dx:28,  dy:30 },\n    { id:'l_doha',       name:'Doha',          country:'Qatar',         meta:'Tour stop + farm',  cat:'both', date:'2027-02-15', lng:51.53, lat:25.29, dx:30,  dy:-30 },\n    { id:'l_riyadh',     name:'Riyadh',        country:'Saudi Arabia',  meta:'Tour stop + farms', cat:'both', date:'2027-03-20', lng:46.68, lat:24.71, dx:-28, dy:24, anchor:'end' },\n    /* Europe — Farms */\n    { id:'l_belgium',    name:'Belgium',       country:'Belgium',       meta:'Farm',              cat:'farm', date:'2027-06-10', lng:4.35,  lat:50.85, dx:12,  dy:-10 },\n    { id:'l_italy_farm', name:'Italy',         country:'Italy',         meta:'Farm',              cat:'farm', date:'2027-06-20', lng:12.50, lat:43.40, dx:12,  dy:-8 },\n    /* Europe — Tour stops */\n    { id:'l_london',     name:'London',        country:'UK',            meta:'Tour stop',         cat:'tour', date:'2027-08-05', lng:-0.13, lat:51.51, dx:-12, dy:-14, anchor:'end' },\n    { id:'l_rome',       name:'Rome',          country:'Italy',         meta:'Tour stop',         cat:'tour', date:'2027-10-15', lng:12.50, lat:41.90, dx:12,  dy:18 },\n    /* Finale — co-located with Doha; nudged out so labels don't collide */\n    { id:'l_supreme',    name:'\"Supreme\" Doha',country:'Qatar',         meta:'Finale',            cat:'tour', date:'2027-12-10', lng:51.85, lat:25.55, dx:38,  dy:14 }\n  ];\n\n  /* Region label decoration (rendered behind pins) */\n  const REGION_LABELS = [\n    { text:'EUROPE',          lng:14, lat:54, size:18, opacity:0.10 },\n    { text:'NORTH AFRICA',    lng:18, lat:25, size:14, opacity:0.10 },\n    { text:'ARABIA',          lng:46, lat:21, size:14, opacity:0.10 },\n    { text:'MEDITERRANEAN',   lng:18, lat:36, size:11, opacity:0.06, italic:true }\n  ];\n\n  let pins = loadPins();\n  let activeCats = new Set(CAT_ORDER);\n  let activeId = null;\n  let draftEl = null;\n  let projection = null;\n  let pathGen = null;\n\n  /* Migrate any old localStorage entries that used x,y to lng,lat by name match */\n  function loadPins(){\n    try{\n      const raw = localStorage.getItem('arabians_pins_v7');\n      if (!raw) return SEED.slice();\n      const p = JSON.parse(raw);\n      if (Array.isArray(p) && p.length) return p;\n    } catch(e){}\n    /* Drop the v1 (x/y) cache so seed v2 wins on first load */\n    try { localStorage.removeItem('arabians_pins_v1'); } catch(e){}\n    return SEED.slice();\n  }\n  function savePins(){\n    try{ localStorage.setItem('arabians_pins_v7', JSON.stringify(pins)); }catch(e){}\n  }\n\n  function pid(){ return 'l_' + Math.random().toString(36).slice(2,9); }\n\n  \n  function formatPinDate(iso){\n    if (!iso) return '';\n    /* Expect YYYY-MM-DD; output e.g. 'MAY 2026' */\n    const m = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(iso);\n    if (!m) return iso.toUpperCase();\n    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];\n    const day = parseInt(m[3], 10);\n    return day + ' ' + months[parseInt(m[2],10)-1] + ' ' + m[1];\n  }\n\n  function setupProjection(){\n    /* Region of interest: -12W..62E lng, 18N..58N lat — Western Europe through Oman */\n    const W = 1000, H = 620;\n    projection = d3.geoMercator();\n    /* Use fitExtent on a multi-point geometry covering the bbox we want visible */\n    const bbox = {\n      type:'MultiPoint',\n      coordinates:[[-12,58],[62,58],[62,18],[-12,18]]\n    };\n    projection.fitExtent([[12,12],[W-12,H-12]], bbox);\n    pathGen = d3.geoPath(projection);\n  }\n\n  function renderCountries(world){\n    const countries = topojson.feature(world, world.objects.countries);\n    const frag = document.createDocumentFragment();\n    countries.features.forEach(f => {\n      const path = document.createElementNS(SVG_NS, 'path');\n      path.setAttribute('class','country');\n      const d = pathGen(f);\n      if (!d) return;\n      path.setAttribute('d', d);\n      frag.appendChild(path);\n    });\n    countriesLayer.innerHTML = '';\n    countriesLayer.appendChild(frag);\n  }\n\n  function renderRegionLabels(){\n    regionLabelsLayer.innerHTML = '';\n    REGION_LABELS.forEach(r => {\n      const p = projection([r.lng, r.lat]);\n      if (!p) return;\n      const t = document.createElementNS(SVG_NS, 'text');\n      t.setAttribute('class','label-c');\n      t.setAttribute('x', p[0]);\n      t.setAttribute('y', p[1]);\n      t.setAttribute('text-anchor','middle');\n      t.setAttribute('style', `font-size:${r.size}px;opacity:${r.opacity};${r.italic?'font-style:italic':'font-style:normal'};letter-spacing:0.18em;font-family:'Jost'`);\n      t.textContent = r.text;\n      regionLabelsLayer.appendChild(t);\n    });\n  }\n\n  function renderPins(){\n    pinsLayer.innerHTML = '';\n    pins.forEach(p => {\n      if (!activeCats.has(p.cat)) return;\n      const xy = projection([p.lng, p.lat]);\n      if (!xy) return;\n      const g = document.createElementNS(SVG_NS, 'g');\n      g.setAttribute('class', 'pin ' + p.cat + (p.id === activeId ? ' active' : ''));\n      g.setAttribute('transform', `translate(${xy[0]} ${xy[1]})`);\n      g.dataset.id = p.id;\n\n      const ring = document.createElementNS(SVG_NS, 'circle');\n      ring.setAttribute('class','ring');\n      ring.setAttribute('r', '11');\n      g.appendChild(ring);\n\n      const core = document.createElementNS(SVG_NS, 'circle');\n      core.setAttribute('class','core');\n      core.setAttribute('r', '5');\n      g.appendChild(core);\n\n      /* Leader line from pin core to label */\n      const dx = (p.dx != null ? p.dx : 8);\n      const dy = (p.dy != null ? p.dy : 14);\n      const anchor = p.anchor || 'start';\n      const leader = document.createElementNS(SVG_NS, 'line');\n      leader.setAttribute('class','lbl-leader');\n      leader.setAttribute('x1', 0);\n      leader.setAttribute('y1', 0);\n      /* End the leader just before the label baseline of t1 */\n      const lx = anchor === 'end' ? dx + 4 : dx - 4;\n      leader.setAttribute('x2', lx);\n      leader.setAttribute('y2', dy - 3);\n      g.appendChild(leader);\n\n      const t1 = document.createElementNS(SVG_NS, 'text');\n      t1.setAttribute('class','lbl-name');\n      t1.setAttribute('x', dx);\n      t1.setAttribute('y', dy);\n      t1.setAttribute('text-anchor', anchor);\n      t1.textContent = (p.name || '').toUpperCase();\n      g.appendChild(t1);\n\n      if (p.country){\n        const t2 = document.createElementNS(SVG_NS, 'text');\n        t2.setAttribute('class','lbl-country');\n        t2.setAttribute('x', dx);\n        t2.setAttribute('y', dy + 12);\n        t2.setAttribute('text-anchor', anchor);\n        t2.textContent = '(' + p.country.toUpperCase() + ')';\n        g.appendChild(t2);\n      }\n      if (p.date){\n        const t3 = document.createElementNS(SVG_NS, 'text');\n        t3.setAttribute('class','lbl-date');\n        t3.setAttribute('x', dx);\n        t3.setAttribute('y', dy + (p.country ? 24 : 12));\n        t3.setAttribute('text-anchor', anchor);\n        t3.textContent = formatPinDate(p.date);\n        g.appendChild(t3);\n      }\n\n      /* === DRAG TO REPOSITION === */\n      let dragState = null;\n      g.addEventListener('pointerdown', e => {\n        if (e.button !== 0) return;\n        e.stopPropagation();\n        const pt = svg.createSVGPoint();\n        pt.x = e.clientX; pt.y = e.clientY;\n        const ctm = svg.getScreenCTM();\n        if (!ctm) return;\n        const start = pt.matrixTransform(ctm.inverse());\n        dragState = {\n          startX: start.x, startY: start.y,\n          origX: xy[0], origY: xy[1],\n          moved: false,\n          pointerId: e.pointerId,\n        };\n        try { g.setPointerCapture(e.pointerId); } catch(_){}\n      });\n      g.addEventListener('pointermove', e => {\n        if (!dragState) return;\n        const pt = svg.createSVGPoint();\n        pt.x = e.clientX; pt.y = e.clientY;\n        const ctm = svg.getScreenCTM();\n        if (!ctm) return;\n        const cur = pt.matrixTransform(ctm.inverse());\n        const dxm = cur.x - dragState.startX;\n        const dym = cur.y - dragState.startY;\n        if (!dragState.moved && (Math.abs(dxm) > 2 || Math.abs(dym) > 2)){\n          dragState.moved = true;\n          g.classList.add('dragging');\n        }\n        if (dragState.moved){\n          const nx = dragState.origX + dxm;\n          const ny = dragState.origY + dym;\n          g.setAttribute('transform', `translate(${nx} ${ny})`);\n        }\n      });\n      const endDrag = e => {\n        if (!dragState) return;\n        const wasMoved = dragState.moved;\n        try { g.releasePointerCapture(dragState.pointerId); } catch(_){}\n        if (wasMoved){\n          const pt = svg.createSVGPoint();\n          pt.x = e.clientX; pt.y = e.clientY;\n          const ctm = svg.getScreenCTM();\n          if (ctm){\n            const cur = pt.matrixTransform(ctm.inverse());\n            const nx = dragState.origX + (cur.x - dragState.startX);\n            const ny = dragState.origY + (cur.y - dragState.startY);\n            const ll = projection.invert([nx, ny]);\n            const target = pins.find(x => x.id === p.id);\n            if (target && ll && isFinite(ll[0]) && isFinite(ll[1])){\n              target.lng = ll[0];\n              target.lat = ll[1];\n              savePins();\n            }\n          }\n          g.classList.remove('dragging');\n          dragState = null;\n          renderPins();\n          /* swallow the click that follows */\n          const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); };\n          g.addEventListener('click', swallow, { capture:true, once:true });\n        } else {\n          dragState = null;\n          /* treat as click */\n          if (e.shiftKey){ cyclePin(p.id); }\n          else { activatePin(p.id, true); }\n        }\n      };\n      g.addEventListener('pointerup', endDrag);\n      g.addEventListener('pointercancel', () => { if (dragState){ g.classList.remove('dragging'); dragState = null; renderPins(); } });\n      g.addEventListener('dblclick', e => { e.stopPropagation(); cyclePin(p.id); });\n\n      pinsLayer.appendChild(g);\n    });\n  }\n\n  function renderList(){\n    pinList.innerHTML = '';\n    const visible = pins.filter(p => activeCats.has(p.cat));\n    visible.forEach(p => {\n      const row = document.createElement('div');\n      row.className = 'pl-row' + (p.id === activeId ? ' active' : '');\n      row.dataset.id = p.id;\n      row.innerHTML = `\n        <div class=\"pl-dot ${p.cat}\"><\u002Fdiv>\n        <div class=\"pl-info\">\n          <div class=\"pl-name\" contenteditable=\"true\" spellcheck=\"false\" title=\"Click to edit name\"><\u002Fdiv>\n          <div class=\"pl-meta\" contenteditable=\"true\" spellcheck=\"false\" title=\"Click to edit detail\"><\u002Fdiv>\n          <div class=\"pl-date-wrap\">\n            <span class=\"pl-date-lbl\">SHOOT<\u002Fspan>\n            <input type=\"date\" class=\"pl-date\" value=\"${p.date || ''}\" />\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pl-actions\">\n          <button class=\"pl-act\" data-act=\"cycle\" title=\"Cycle category\">↻<\u002Fbutton>\n          <button class=\"pl-act\" data-act=\"del\" title=\"Remove\">×<\u002Fbutton>\n        <\u002Fdiv>`;\n      const nameEl = row.querySelector('.pl-name');\n      const metaEl = row.querySelector('.pl-meta');\n      nameEl.textContent = p.name;\n      metaEl.textContent = p.meta || CATS[p.cat].label;\n      /* Inline edit: name + meta — persist on blur / Enter, prevent row click while editing */\n      [nameEl, metaEl].forEach((el, i) => {\n        el.addEventListener('click', e => e.stopPropagation());\n        el.addEventListener('mousedown', e => e.stopPropagation());\n        el.addEventListener('keydown', e => {\n          e.stopPropagation();\n          if (e.key === 'Enter'){ e.preventDefault(); el.blur(); }\n          if (e.key === 'Escape'){ el.textContent = (i === 0 ? p.name : (p.meta || CATS[p.cat].label)); el.blur(); }\n        });\n        el.addEventListener('blur', () => {\n          const target = pins.find(x => x.id === p.id);\n          if (!target) return;\n          const v = el.textContent.trim();\n          if (i === 0){ target.name = v || target.name; el.textContent = target.name; }\n          else { target.meta = v; }\n          savePins(); renderPins();\n        });\n      });\n      const dateInput = row.querySelector('.pl-date');\n      dateInput.addEventListener('click', e => e.stopPropagation());\n      dateInput.addEventListener('change', e => {\n        e.stopPropagation();\n        const target = pins.find(x => x.id === p.id);\n        if (target){ target.date = dateInput.value; savePins(); renderPins(); }\n      });\n      row.addEventListener('click', e => {\n        const act = e.target.closest('[data-act]');\n        if (act){\n          e.stopPropagation();\n          if (act.dataset.act === 'del'){ deletePin(p.id); }\n          else if (act.dataset.act === 'cycle'){ cyclePin(p.id); }\n          return;\n        }\n        activatePin(p.id, false);\n      });\n      pinList.appendChild(row);\n    });\n\n    const counts = { tour:0, farm:0, both:0 };\n    pins.forEach(p => counts[p.cat] = (counts[p.cat]||0) + 1);\n    legend.querySelectorAll('[data-num]').forEach(n => {\n      n.textContent = String(counts[n.dataset.num] || 0).padStart(2,'0');\n    });\n    locCount.textContent = pins.length + ' PIN' + (pins.length === 1 ? '' : 'S') + ' · 3 CATEGORIES';\n    legend.querySelectorAll('.lg-row').forEach(r => {\n      r.classList.toggle('muted', !activeCats.has(r.dataset.cat));\n    });\n  }\n\n  function activatePin(id, scrollList){\n    activeId = id;\n    renderPins();\n    renderList();\n    if (scrollList){\n      const row = pinList.querySelector(`.pl-row[data-id=\"${id}\"]`);\n      if (row) row.scrollIntoView({ block:'nearest' });\n    }\n  }\n  function cyclePin(id){\n    const p = pins.find(x => x.id === id);\n    if (!p) return;\n    const i = CAT_ORDER.indexOf(p.cat);\n    p.cat = CAT_ORDER[(i + 1) % CAT_ORDER.length];\n    activeCats.add(p.cat);\n    savePins();\n    renderPins(); renderList();\n    showToast('Category → ' + CATS[p.cat].label);\n  }\n  function deletePin(id){\n    pins = pins.filter(p => p.id !== id);\n    if (activeId === id) activeId = null;\n    savePins();\n    renderPins(); renderList();\n    showToast('Removed');\n  }\n\n  function clientToSvg(clientX, clientY){\n    const pt = svg.createSVGPoint();\n    pt.x = clientX; pt.y = clientY;\n    const m = svg.getScreenCTM();\n    if (!m) return [0,0];\n    const inv = m.inverse();\n    const r = pt.matrixTransform(inv);\n    return [r.x, r.y];\n  }\n\n  function closeDraft(){ if (draftEl){ draftEl.remove(); draftEl = null; } }\n\n  function openDraft(lng, lat, clientX, clientY){\n    closeDraft();\n    const rect = mapWrap.getBoundingClientRect();\n    let px = clientX - rect.left;\n    let py = clientY - rect.top;\n    const W = 260, H = 220;\n    px = Math.min(Math.max(12, px + 14), rect.width - W - 12);\n    py = Math.min(Math.max(12, py - 10), rect.height - H - 12);\n\n    const d = document.createElement('div');\n    d.className = 'draft';\n    d.style.left = px + 'px';\n    d.style.top = py + 'px';\n    d.innerHTML = `\n      <div class=\"dh\">New Location<\u002Fdiv>\n      <input type=\"text\" placeholder=\"Name (e.g. Riyadh)\" class=\"d-name\" autocomplete=\"off\"/>\n      <input type=\"text\" placeholder=\"Country (optional)\" class=\"d-country\" autocomplete=\"off\"/>\n      <input type=\"date\" class=\"d-date\" />\n      <div class=\"draft-cats\">\n        <button class=\"dcat tour\" data-cat=\"tour\"><span class=\"dot\"><\u002Fspan>Tour<\u002Fbutton>\n        <button class=\"dcat farm sel\" data-cat=\"farm\"><span class=\"dot\"><\u002Fspan>Farm<\u002Fbutton>\n        <button class=\"dcat both\" data-cat=\"both\"><span class=\"dot\"><\u002Fspan>Both<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"dactions\">\n        <button class=\"dbtn\" data-act=\"cancel\">Cancel<\u002Fbutton>\n        <button class=\"dbtn primary\" data-act=\"save\">Place<\u002Fbutton>\n      <\u002Fdiv>`;\n    mapWrap.appendChild(d);\n    draftEl = d;\n\n    let chosen = 'farm';\n    d.querySelectorAll('.dcat').forEach(b => {\n      b.addEventListener('click', () => {\n        chosen = b.dataset.cat;\n        d.querySelectorAll('.dcat').forEach(x => x.classList.remove('sel'));\n        b.classList.add('sel');\n      });\n    });\n    const nameInput = d.querySelector('.d-name');\n    const countryInput = d.querySelector('.d-country');\n    setTimeout(() => nameInput.focus(), 60);\n\n    function commit(){\n      const name = nameInput.value.trim();\n      if (!name){ nameInput.focus(); flashInput(nameInput); return; }\n      const country = countryInput.value.trim();\n      const meta = country ? country : CATS[chosen].label;\n      const date = (d.querySelector('.d-date') || {}).value || '';\n      const p = { id: pid(), name, country, meta, cat: chosen, date, lng, lat, dx:8, dy:14 };\n      pins.push(p);\n      activeCats.add(chosen);\n      activeId = p.id;\n      savePins();\n      renderPins(); renderList();\n      closeDraft();\n      showToast('Pinned · ' + name);\n    }\n    d.querySelector('[data-act=save]').addEventListener('click', commit);\n    d.querySelector('[data-act=cancel]').addEventListener('click', closeDraft);\n    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); });\n    countryInput.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); });\n    d.addEventListener('click', e => e.stopPropagation());\n  }\n\n  function flashInput(el){\n    const o = el.style.borderBottomColor;\n    el.style.borderBottomColor = '#E5514A';\n    setTimeout(() => el.style.borderBottomColor = o || '', 600);\n  }\n\n  /* Click on map → invert to lng/lat → open draft */\n  svg.addEventListener('click', e => {\n    if (!projection) return;\n    if (e.target.closest('.pin')) return;\n    const [sx, sy] = clientToSvg(e.clientX, e.clientY);\n    const ll = projection.invert([sx, sy]);\n    if (!ll) return;\n    openDraft(ll[0], ll[1], e.clientX, e.clientY);\n  });\n\n  document.addEventListener('click', e => {\n    if (draftEl && !draftEl.contains(e.target) && !svg.contains(e.target)){ closeDraft(); }\n  });\n  window.addEventListener('keydown', e => { if (e.key === 'Escape' && draftEl) closeDraft(); });\n\n  legend.querySelectorAll('.lg-row').forEach(row => {\n    row.addEventListener('click', () => {\n      const cat = row.dataset.cat;\n      if (activeCats.has(cat)){\n        if (activeCats.size === 1) return;\n        activeCats.delete(cat);\n      } else {\n        activeCats.add(cat);\n      }\n      renderPins(); renderList();\n    });\n  });\n\n  /* Boot — load TopoJSON, set up projection, render */\n  async function boot(){\n    if (!window.d3 || !window.topojson){\n      mapLoading.textContent = 'Map libraries unavailable';\n      return;\n    }\n    setupProjection();\n    /* Render the panel + legend immediately so the right side is populated even before geo loads */\n    renderList();\n    try{\n      const res = await fetch((window.__resources && window.__resources.worldAtlas) || 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');\n      if (!res.ok) throw new Error('HTTP ' + res.status);\n      const world = await res.json();\n      renderCountries(world);\n      renderRegionLabels();\n      renderPins();\n      mapLoading.classList.add('hidden');\n    } catch(err){\n      console.warn('Map load failed:', err);\n      mapLoading.textContent = 'Map data unavailable';\n    }\n  }\n  boot();\n})();\n<\u002Fscript>\n\n\n\n\n<script>\n/* ============ NAVIGATION HARDENING ============\n   The deck-stage component installs mobile \"tap zones\" (left/right thirds of\n   the screen that navigate on click). On touch laptops + hybrid devices these\n   activate even when you don't expect them, swallowing card/quadrant clicks\n   and feeling like accidental navigation.\n\n   Goal:\n   - Slide clicks NEVER navigate. (Tap zones removed.)\n   - Navigation only via: bottom prev/next buttons + ← / → keys.\n   - Keyboard nav is already focus-aware (ignored inside inputs/contenteditable).\n   - Bottom overlay (prev · count · next) stays visible and unchanged.\n   - All in-slide interactivity (cards, drag, modals, drawer) works without any\n     stopPropagation gymnastics — there's no longer a parent click listener to\n     fight with. */\n(function(){\n  function harden(){\n    var ds = document.querySelector('deck-stage');\n    if (!ds || !ds.shadowRoot) return false;\n    var sr = ds.shadowRoot;\n\n    // 1. CSS belt: hide tap zones for all pointer types (deck-stage gates them\n    //    to coarse pointers via media query, but we want them off everywhere).\n    if (!sr.querySelector('#nav-hardening')){\n      var s = document.createElement('style');\n      s.id = 'nav-hardening';\n      s.textContent = '.tapzones,.tapzone{display:none !important;pointer-events:none !important}';\n      sr.appendChild(s);\n    }\n\n    // 2. Belt-and-suspenders: physically remove the tap-zone container so its\n    //    click handlers can't fire even if a future style override re-shows it.\n    var tz = sr.querySelector('.tapzones');\n    if (tz && tz.parentNode) tz.parentNode.removeChild(tz);\n\n    return true;\n  }\n\n  // Apply as soon as the shadow DOM is ready, then stop polling.\n  var t = setInterval(function(){ if (harden()) clearInterval(t); }, 60);\n  setTimeout(function(){ clearInterval(t); }, 8000);\n\n  // Re-apply after fullscreen toggles in case the host re-mounts the shadow chrome.\n  document.addEventListener('fullscreenchange', function(){\n    harden(); setTimeout(harden, 120); setTimeout(harden, 400);\n  });\n})();\n<\u002Fscript>\n<script src=\"5de3c28b-b94e-4785-9bcc-92d193a54bd7\"><\u002Fscript>\n<script src=\"7faf6360-10a2-4c3c-a86e-0d578200a952\"><\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
  </script>
